name: Wait for HCP Terraform
description: >-
  Holds until the workspace's latest run can no longer change infrastructure under
  the deploy. A run parked in planned awaiting confirmation is not a wait: a plan
  with no resource changes is reported and passed through, and a plan that does
  have changes fails immediately with the run URL rather than polling until timeout.

inputs:
  workspace-id:
    description: "HCP Terraform workspace id, for example ws-XXXXXXXXXXXXXXXX. Takes precedence over organization plus workspace."
    required: false
    default: ""
  organization:
    description: "HCP Terraform organization owning the workspace. Required when workspace-id is empty."
    required: false
    default: ""
  workspace:
    description: "HCP Terraform workspace name. Required when workspace-id is empty."
    required: false
    default: ""
  api-token:
    description: "HCP Terraform API token with read access to the workspace runs."
    required: true
  attempts:
    description: "How many times to poll the workspace before giving up."
    required: false
    default: "40"
  interval-seconds:
    description: "Seconds between polls of the workspace."
    required: false
    default: "15"

runs:
  using: composite
  steps:
    - name: Wait for the HCP Terraform workspace to go idle
      shell: bash
      env:
        TFC_WORKSPACE_ID: ${{ inputs.workspace-id }}
        TFC_ORGANIZATION: ${{ inputs.organization }}
        TFC_WORKSPACE: ${{ inputs.workspace }}
        TFC_API_TOKEN: ${{ inputs.api-token }}
        TFC_WAIT_ATTEMPTS: ${{ inputs.attempts }}
        TFC_WAIT_INTERVAL_SECONDS: ${{ inputs.interval-seconds }}
      run: |
        set -euo pipefail

        if [ -z "$TFC_API_TOKEN" ]; then
          echo "api-token is empty, so the workspace runs cannot be read."
          exit 1
        fi

        api() {
          curl -sfg \
            -H "Authorization: Bearer $TFC_API_TOKEN" \
            -H "Content-Type: application/vnd.api+json" \
            "$1"
        }

        if [ -z "$TFC_WORKSPACE_ID" ]; then
          if [ -z "$TFC_ORGANIZATION" ] || [ -z "$TFC_WORKSPACE" ]; then
            echo "workspace-id is empty, so organization and workspace are both required."
            exit 1
          fi
          TFC_WORKSPACE_ID=$(api "https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}/workspaces/${TFC_WORKSPACE}" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['data']['id'])")
          echo "Resolved workspace ${TFC_WORKSPACE} to ${TFC_WORKSPACE_ID}."
        fi

        SETTLED="applied planned_and_finished discarded errored canceled force_canceled"

        for ATTEMPT in $(seq 1 "$TFC_WAIT_ATTEMPTS"); do
          FIELDS=$(api "https://app.terraform.io/api/v2/workspaces/${TFC_WORKSPACE_ID}/runs?page%5Bsize%5D=1" \
            | python3 -c "
        import json
        import sys

        runs = json.load(sys.stdin).get('data', [])
        if not runs:
            print('none no_runs false false')
            raise SystemExit(0)

        attributes = runs[0]['attributes']
        actions = attributes.get('actions') or {}
        print(
            runs[0]['id'],
            attributes['status'],
            str(bool(attributes.get('has-changes'))).lower(),
            str(bool(actions.get('is-confirmable'))).lower(),
        )
        ")
          read -r RUN_ID STATUS HAS_CHANGES CONFIRMABLE <<< "$FIELDS"
          echo "Attempt ${ATTEMPT}/${TFC_WAIT_ATTEMPTS}: latest run status is ${STATUS}."

          if [ "$STATUS" = "no_runs" ] || printf '%s' "$SETTLED" | grep -qw "$STATUS"; then
            echo "Terraform is idle, so the deploy can proceed."
            exit 0
          fi

          if [ "$CONFIRMABLE" = "true" ]; then
            RUN_URL="https://app.terraform.io/app/${TFC_ORGANIZATION:-_}/workspaces/${TFC_WORKSPACE:-$TFC_WORKSPACE_ID}/runs/${RUN_ID}"
            if [ "$HAS_CHANGES" = "false" ]; then
              echo "Run ${RUN_ID} is parked in ${STATUS} awaiting confirmation but plans no resource changes,"
              echo "so it cannot move anything under this deploy. Proceeding."
              echo "Run: ${RUN_URL}"
              {
                echo "## HCP Terraform"
                echo
                echo "Run \`${RUN_ID}\` is awaiting confirmation with no resource changes, so the deploy did not wait."
                echo
                echo "[${RUN_ID}](${RUN_URL})"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Run ${RUN_ID} is parked in ${STATUS} awaiting confirmation and plans resource changes."
            echo "Waiting would time out, so this deploy stops now. Apply or discard the run, then rerun."
            echo "Run: ${RUN_URL}"
            {
              echo "## HCP Terraform"
              echo
              echo "Run \`${RUN_ID}\` is awaiting confirmation and plans resource changes, so the deploy stopped"
              echo "rather than deploying against infrastructure that is about to move."
              echo
              echo "Apply or discard it, then rerun this workflow: [${RUN_ID}](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          sleep "$TFC_WAIT_INTERVAL_SECONDS"
        done

        echo "Timed out waiting for the workspace to go idle."
        exit 1
