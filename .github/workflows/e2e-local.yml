name: End-to-end verification on a local stack

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Python project root holding pyproject.toml and uv.lock."
        type: string
        required: false
        default: "backend"
      e2e-directory:
        description: "Directory pytest collects, relative to working-directory."
        type: string
        required: false
        default: "e2e"
      install-command:
        description: "Command used to install the e2e dependency group with uv, run in working-directory."
        type: string
        required: false
        default: "uv sync --locked --group e2e"
      python-version:
        description: "Python version uv provisions for the project environment."
        type: string
        required: false
        default: "3.13"
      pytest-args:
        description: "Extra arguments appended to the pytest invocation."
        type: string
        required: false
        default: ""
      codeartifact-domain:
        description: "CodeArtifact domain. Leave empty to skip both CodeArtifact auth steps."
        type: string
        required: false
        default: ""
      codeartifact-index:
        description: >-
          Name of the `[[tool.uv.index]]` entry the token authenticates, which decides the
          UV_INDEX_<NAME>_USERNAME and UV_INDEX_<NAME>_PASSWORD variables that carry it.
        type: string
        required: false
        default: "codeartifact"
      codeartifact-repository:
        description: "CodeArtifact repository the npm login binds. Empty skips the npm login."
        type: string
        required: false
        default: ""
      codeartifact-namespace:
        description: >-
          npm scope bound to CodeArtifact, for example @webbpulse. Must start with @.
          Binding a scope keeps the public registry as the default, so only that scope
          resolves through CodeArtifact and the rest of npm is not proxied and billed.
        type: string
        required: false
        default: "@webbpulse"
      aws-region:
        description: "AWS region for the CodeArtifact token. The stack itself calls no AWS API."
        type: string
        required: false
        default: "us-west-2"
      node-version:
        description: "Node.js version to set up for the frontend build and the preview server."
        type: string
        required: false
        default: "22"
      frontend-directory:
        description: "Directory holding the SPA's package.json."
        type: string
        required: false
        default: "frontend"
      frontend-build-command:
        description: "Command that builds the SPA, run in frontend-directory."
        type: string
        required: false
        default: "npm run build"
      frontend-build-env-json:
        description: >-
          JSON object of environment variables exported before the SPA build, for example
          the Vite variable carrying the local API base URL. Not for secrets, which would
          be visible in the run log.
        type: string
        required: false
        default: "{}"
      preview-command:
        description: "Command that serves the built SPA, run in frontend-directory in the background."
        type: string
        required: false
        default: "npx vite preview --host 127.0.0.1 --port 4173"
      web-base-url:
        description: "Origin the preview server answers on. Must match preview-command's host and port."
        type: string
        required: false
        default: "http://127.0.0.1:4173"
      backend-env-json:
        description: >-
          JSON object of environment variables exported before the backend starts, carrying
          the whole local stack configuration: the DynamoDB Local endpoint, the dummy AWS
          credentials, the identity settings and the per run secret values. Not for real
          secrets, which would be visible in the run log.
        type: string
        required: false
        default: "{}"
      backend-start-command:
        description: "Command that starts the backend, run in working-directory in the background."
        type: string
        required: false
        default: "uv run uvicorn app.composition.app:app --host 127.0.0.1 --port 8000"
      api-base-url:
        description: "Origin the backend answers on. Must match backend-start-command's host and port."
        type: string
        required: false
        default: "http://127.0.0.1:8000"
      health-path:
        description: "Path polled until it answers 200, relative to api-base-url."
        type: string
        required: false
        default: "/health"
      table-bootstrap-command:
        description: >-
          Command that creates the DynamoDB Local tables, run in working-directory after the
          install. Empty skips the step, which only suits a stack with no tables.
        type: string
        required: false
        default: ""
      dynamodb-image:
        description: >-
          DynamoDB Local image the service container runs. The image's own default command is
          `-jar DynamoDBLocal.jar -inMemory -sharedDb`, which is what the stack wants, and a
          GitHub `services:` block cannot override a container command, so pin a tag whose
          default holds rather than expecting to pass arguments.
        type: string
        required: false
        default: "amazon/dynamodb-local:latest"
      dynamodb-port:
        description: "Host port DynamoDB Local is published on. The backend environment must point at it."
        type: number
        required: false
        default: 8001
      browser:
        description: "Playwright browser the suite drives, chromium, firefox or webkit."
        type: string
        required: false
        default: "chromium"
      headless:
        description: "Run the browser headless."
        type: boolean
        required: false
        default: true
      check-name:
        description: "Name of the published check run."
        type: string
        required: false
        default: "e2e (local)"
      timeout-minutes:
        description: "Minutes the job may run before GitHub cancels it, so a hung run never blocks the next one."
        type: number
        required: false
        default: 30
      runs-on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      role-to-assume:
        description: "IAM role ARN assumed via OIDC to read from CodeArtifact. Nothing else uses it."
        required: false
      codeartifact-domain-owner:
        description: "AWS account id that owns the CodeArtifact domain. Required when codeartifact-domain is set."
        required: false

permissions:
  contents: read

jobs:
  e2e-local:
    name: e2e (local)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write
      checks: write
    services:
      dynamodb-local:
        image: ${{ inputs.dynamodb-image }}
        ports:
          - ${{ inputs.dynamodb-port }}:8000
        options: >-
          --health-cmd "curl -s -o /dev/null http://127.0.0.1:8000/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    env:
      E2E_ENVIRONMENT: local
      E2E_API_BASE_URL: ${{ inputs.api-base-url }}
      E2E_WEB_BASE_URL: ${{ inputs.web-base-url }}
      E2E_AWS_REGION: ${{ inputs.aws-region }}
      E2E_BROWSER: ${{ inputs.browser }}
      E2E_HEADLESS: ${{ inputs.headless }}
      E2E_READ_ONLY: "false"
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AWS_REGION: ${{ inputs.aws-region }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHECK_NAME: ${{ inputs.check-name }}
      MODE: full
      JUNIT_PATH: ${{ inputs.working-directory }}/e2e-results.xml
    steps:
      - name: Forward the Environment's E2E_ variables
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid

          values = json.loads(os.environ["VARS_JSON"] or "{}")
          forwarded = []
          skipped = []
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key in sorted(values):
                  if not key.startswith("E2E_"):
                      continue
                  if os.environ.get(key):
                      skipped.append(key)
                      continue
                  delimiter = f"ghadelim_{uuid.uuid4().hex}"
                  handle.write(f"{key}<<{delimiter}\n{values[key]}\n{delimiter}\n")
                  forwarded.append(key)
          print("Forwarded: " + (", ".join(forwarded) or "(none)"))
          print("Already resolved by the workflow, left alone: " + (", ".join(skipped) or "(none)"))
          PY

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.frontend-directory }}/package-lock.json

      - name: Validate the CodeArtifact inputs
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner != '' && secrets.codeartifact-domain-owner || vars.CODEARTIFACT_DOMAIN_OWNER }}
          ROLE_TO_ASSUME: ${{ secrets.role-to-assume != '' && secrets.role-to-assume || vars.CI_AWS_ROLE_ARN }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          CODEARTIFACT_NAMESPACE: ${{ inputs.codeartifact-namespace }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$CODEARTIFACT_DOMAIN_OWNER" ] || MISSING="$MISSING codeartifact-domain-owner"
          [ -n "$ROLE_TO_ASSUME" ] || MISSING="$MISSING role-to-assume"
          if [ -n "$MISSING" ]; then
            echo "::error::codeartifact-domain is set, so these are required too:$MISSING"
            exit 1
          fi
          if [ -n "$CODEARTIFACT_REPOSITORY" ]; then
            if [ -z "$CODEARTIFACT_NAMESPACE" ]; then
              echo "::error::codeartifact-namespace is empty. Pass the npm scope to bind, for example @webbpulse. Without it the npm login rewrites the default registry and proxies the whole public npm registry through CodeArtifact."
              exit 1
            fi
            case "$CODEARTIFACT_NAMESPACE" in
              @*) ;;
              *)
                echo "::error::codeartifact-namespace must start with @, got $CODEARTIFACT_NAMESPACE."
                exit 1
                ;;
            esac
          fi

      - name: Configure AWS credentials via OIDC for CodeArtifact
        if: inputs.codeartifact-domain != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume != '' && secrets.role-to-assume || vars.CI_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Authenticate the CodeArtifact index for uv
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner != '' && secrets.codeartifact-domain-owner || vars.CODEARTIFACT_DOMAIN_OWNER }}
          CODEARTIFACT_INDEX: ${{ inputs.codeartifact-index }}
        run: |
          set -euo pipefail
          INDEX=$(echo "$CODEARTIFACT_INDEX" | tr '[:lower:]' '[:upper:]' | tr -c '[:alnum:]' '_')
          INDEX=${INDEX%_}
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "UV_INDEX_${INDEX}_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_${INDEX}_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "Authenticated the $CODEARTIFACT_INDEX index."

      - name: Log in to CodeArtifact for npm
        if: inputs.codeartifact-domain != '' && inputs.codeartifact-repository != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner != '' && secrets.codeartifact-domain-owner || vars.CODEARTIFACT_DOMAIN_OWNER }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          CODEARTIFACT_NAMESPACE: ${{ inputs.codeartifact-namespace }}
        run: |
          set -euo pipefail
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY" \
            --namespace "$CODEARTIFACT_NAMESPACE"

      - name: Install the e2e dependency group
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Activate the project environment
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Apply the backend environment
        env:
          BACKEND_ENV_JSON: ${{ inputs.backend-env-json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid

          values = json.loads(os.environ["BACKEND_ENV_JSON"] or "{}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  delimiter = f"ghadelim_{uuid.uuid4().hex}"
                  handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Applied backend environment keys: " + ", ".join(sorted(values)))
          PY

      - name: Wait for DynamoDB Local to answer
        env:
          DYNAMODB_URL: http://127.0.0.1:${{ inputs.dynamodb-port }}
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 60); do
            if curl -s -o /dev/null "$DYNAMODB_URL"; then
              echo "DynamoDB Local answered on ${DYNAMODB_URL} after ${ATTEMPT}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::DynamoDB Local did not answer on ${DYNAMODB_URL} within 60 seconds."
          exit 1

      - name: Create the DynamoDB Local tables
        if: inputs.table-bootstrap-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.table-bootstrap-command }}

      - name: Start the backend
        working-directory: ${{ inputs.working-directory }}
        env:
          BACKEND_START_COMMAND: ${{ inputs.backend-start-command }}
        run: |
          set -euo pipefail
          nohup bash -c "$BACKEND_START_COMMAND" > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
          echo "Started the backend as pid $!."

      - name: Wait for the backend to answer
        working-directory: ${{ inputs.working-directory }}
        env:
          HEALTH_URL: ${{ inputs.api-base-url }}${{ inputs.health-path }}
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "The backend answered 200 on ${HEALTH_URL} after ${ATTEMPT}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The backend did not answer 200 on ${HEALTH_URL} within 60 seconds."
          tail -n 200 backend.log || true
          exit 1

      - name: Install the frontend dependencies
        working-directory: ${{ inputs.frontend-directory }}
        run: npm ci --no-progress

      - name: Apply the frontend build environment
        env:
          FRONTEND_BUILD_ENV_JSON: ${{ inputs.frontend-build-env-json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid

          values = json.loads(os.environ["FRONTEND_BUILD_ENV_JSON"] or "{}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  delimiter = f"ghadelim_{uuid.uuid4().hex}"
                  handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Applied frontend build environment keys: " + ", ".join(sorted(values)))
          PY

      - name: Build the SPA
        working-directory: ${{ inputs.frontend-directory }}
        run: ${{ inputs.frontend-build-command }}

      - name: Start the preview server
        working-directory: ${{ inputs.frontend-directory }}
        env:
          PREVIEW_COMMAND: ${{ inputs.preview-command }}
        run: |
          set -euo pipefail
          nohup bash -c "$PREVIEW_COMMAND" > preview.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          echo "Started the preview server as pid $!."

      - name: Wait for the preview server to answer
        working-directory: ${{ inputs.frontend-directory }}
        env:
          WEB_BASE_URL: ${{ inputs.web-base-url }}
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$WEB_BASE_URL/" || true)
            if [ "$STATUS" = "200" ]; then
              echo "The preview server answered 200 on ${WEB_BASE_URL} after ${ATTEMPT}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The preview server did not answer 200 on ${WEB_BASE_URL} within 60 seconds."
          tail -n 200 preview.log || true
          exit 1

      - name: Read the installed playwright version
        id: playwright-version
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))" 2>/dev/null); then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "playwright $VERSION"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "::notice::playwright is not in the e2e group, so the browser groups are skipped."
          fi

      - name: Restore the playwright browser cache
        if: steps.playwright-version.outputs.version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ inputs.browser }}

      - name: Install the browser
        if: steps.playwright-version.outputs.version != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          E2E_BROWSER: ${{ inputs.browser }}
        run: python -m playwright install --with-deps "$E2E_BROWSER"

      - name: Run the suite
        id: suite
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          E2E_DIRECTORY: ${{ inputs.e2e-directory }}
        run: |
          set -euo pipefail
          python -m pytest "$E2E_DIRECTORY" \
            --junitxml=e2e-results.xml \
            ${{ inputs.pytest-args }}

      - name: Upload the browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-browser
          path: ${{ inputs.working-directory }}/e2e-browser-artifacts
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the junit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-junit
          path: ${{ inputs.working-directory }}/e2e-results.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the stack logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-logs
          path: |
            ${{ inputs.working-directory }}/backend.log
            ${{ inputs.frontend-directory }}/preview.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the check run
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            /** Read the junit file, returning null when the suite never produced one. */
            function readJunit(file) {
              try {
                return fs.readFileSync(file, "utf8");
              } catch {
                return null;
              }
            }

            /** Collect the ids of failed and errored test cases from a junit document. */
            function failedTestIds(xml) {
              const ids = [];
              const casePattern = /<testcase\b([^>]*?)(\/>|>([\s\S]*?)<\/testcase>)/g;
              for (const match of xml.matchAll(casePattern)) {
                const attributes = match[1];
                const body = match[3] || "";
                if (!/<(failure|error)\b/.test(body)) {
                  continue;
                }
                const classname = /\bclassname="([^"]*)"/.exec(attributes);
                const name = /\bname="([^"]*)"/.exec(attributes);
                const parts = [];
                if (classname && classname[1]) {
                  parts.push(classname[1]);
                }
                if (name && name[1]) {
                  parts.push(name[1]);
                }
                ids.push(parts.join("::") || "(unnamed test)");
              }
              return ids;
            }

            /** Count totals from the junit root or testsuite element. */
            function totals(xml) {
              const attribute = (key) => {
                const pattern = new RegExp(`<testsuite\\b[^>]*?\\b${key}="(\\d+)"`, "g");
                let sum = 0;
                for (const match of xml.matchAll(pattern)) {
                  sum += Number(match[1]);
                }
                return sum;
              };
              return {
                tests: attribute("tests"),
                failures: attribute("failures"),
                errors: attribute("errors"),
                skipped: attribute("skipped"),
              };
            }

            const junitPath = process.env.JUNIT_PATH;
            const xml = readJunit(junitPath);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const suiteOutcome = process.env.SUITE_OUTCOME || "skipped";
            const mode = "local";
            const conclusion = suiteOutcome === "success" ? "success" : suiteOutcome === "cancelled" ? "cancelled" : "failure";

            const lines = [];
            lines.push(`[View the workflow run](${runUrl})`);
            lines.push("");
            lines.push(`Suite: ${suiteOutcome}. Mode: ${mode}.`);
            lines.push("");
            lines.push("A local run drives a stack built from source on the runner: one composed FastAPI app, DynamoDB Local and a vite preview server. It asserts reachability, identity, frontend and browser behaviour. Route cut, coverage against the live gateway, the authorizer, the access gate, per domain isolation and the stream consumers are gateway concerns and stay in the post deploy run.");
            lines.push("");

            if (xml === null) {
              lines.push(`No junit report was written to \`${path.basename(junitPath)}\`, so the suite did not reach the reporting stage.`);
            } else {
              const counts = totals(xml);
              lines.push(`Tests: ${counts.tests}, failures: ${counts.failures}, errors: ${counts.errors}, skipped: ${counts.skipped}.`);
              const failed = failedTestIds(xml);
              if (failed.length > 0) {
                lines.push("");
                lines.push("### Failed tests");
                lines.push("");
                for (const id of failed) {
                  lines.push(`- \`${id}\``);
                }
              }
            }

            const summary = lines.join("\n");
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.CHECK_NAME,
              head_sha: process.env.TARGET_SHA,
              status: "completed",
              conclusion,
              output: {
                title: `${process.env.CHECK_NAME}: ${conclusion} (${mode})`,
                summary: summary.slice(0, 65000),
              },
            });
            core.summary.addRaw(summary).write();

      - name: Report the suite outcome without failing the caller
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          set -euo pipefail
          if [ "$SUITE_OUTCOME" = "success" ]; then
            echo "The suite passed. The check run reports success."
          else
            echo "::warning::The suite concluded ${SUITE_OUTCOME}. The check run reports it; this job stays green because the local suite is not a required check."
          fi
