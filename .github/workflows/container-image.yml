name: Container Image

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: "ECR repository name, without the registry host."
        type: string
        required: true
      aws-region:
        description: "AWS region holding the ECR repository."
        type: string
        required: true
      context:
        description: "Docker build context."
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to the workspace."
        type: string
        required: false
        default: "Dockerfile"
      platform:
        description: "Single target platform. Lambda rejects multi architecture images, so pass exactly one."
        type: string
        required: false
        default: "linux/arm64"
      build-args:
        description: "Newline separated build arguments passed to docker build."
        type: string
        required: false
        default: ""
      codeartifact-domain:
        description: >-
          CodeArtifact domain. Empty skips the token; when set, the token reaches the build as
          a BuildKit secret rather than a build argument.
        type: string
        required: false
        default: ""
      codeartifact-domain-owner:
        description: "AWS account id that owns the CodeArtifact domain. Required when codeartifact-domain is set."
        type: string
        required: false
        default: ""
      codeartifact-repository:
        description: "CodeArtifact repository name. Required when codeartifact-domain is set."
        type: string
        required: false
        default: ""
      codeartifact-secret-id:
        description: >-
          BuildKit secret id the Dockerfile mounts the CodeArtifact token from, as in
          RUN --mount=type=secret,id=codeartifact_token.
        type: string
        required: false
        default: "codeartifact_token"
      additional-ecr-registries:
        description: >-
          Further ECR registry account ids to log in to, so a FROM can pull a base image from
          another account. The caller's own account is always included.
        type: string
        required: false
        default: ""
      skip-if-tag-exists:
        description: >-
          Skip the build when the target tag already resolves, emitting the existing digest.
          Keeps a rerun green against an IMMUTABLE repository.
        type: boolean
        required: false
        default: true
      upload-manifest-artifact:
        description: >-
          Upload a JSON artifact naming the repository, tag, digest and pinned image URI, so a
          fan out job can read every matrix leg's digest back.
        type: boolean
        required: false
        default: false
      artifact-name:
        description: >-
          Name of the manifest artifact. Defaults to image-<repository>-<tag>, unique per
          matrix leg and matching image-* for merge-multiple.
        type: string
        required: false
        default: ""
      environment:
        description: >-
          GitHub Environment to bind the build job to. A caller using a reusable workflow
          cannot declare one itself, so it is passed here.
        type: string
        required: false
        default: ""
      runs-on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      role-to-assume:
        description: "IAM role ARN assumed via OIDC, allowed to push to the ECR repository."
        required: true
    outputs:
      image-digest:
        description: "The pushed image digest, for example sha256:abcd..."
        value: ${{ jobs.build.outputs.image-digest }}
      image-uri:
        description: "Full image URI pinned by digest, registry/repository@sha256:..."
        value: ${{ jobs.build.outputs.image-uri }}
      image-tag:
        description: "The immutable tag applied to the image, sha-<full git sha>."
        value: ${{ jobs.build.outputs.image-tag }}
      image-existed:
        description: "true when the tag already resolved and the build was skipped."
        value: ${{ jobs.build.outputs.image-existed }}

permissions:
  contents: read

jobs:
  build:
    name: Build and push the image
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      image-digest: ${{ steps.uri.outputs.image-digest }}
      image-uri: ${{ steps.uri.outputs.image-uri }}
      image-tag: ${{ steps.tag.outputs.image-tag }}
      image-existed: ${{ steps.existing.outputs.exists == 'true' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the CodeArtifact inputs
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN_OWNER: ${{ inputs.codeartifact-domain-owner }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          CODEARTIFACT_SECRET_ID: ${{ inputs.codeartifact-secret-id }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$CODEARTIFACT_DOMAIN_OWNER" ] || MISSING="$MISSING codeartifact-domain-owner"
          [ -n "$CODEARTIFACT_REPOSITORY" ] || MISSING="$MISSING codeartifact-repository"
          [ -n "$CODEARTIFACT_SECRET_ID" ] || MISSING="$MISSING codeartifact-secret-id"
          if [ -n "$MISSING" ]; then
            echo "codeartifact-domain is set, so these inputs are required too:$MISSING"
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Resolve this account's registry
        id: registry
        env:
          AWS_REGION_INPUT: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ -z "$ACCOUNT_ID" ] || [ "$ACCOUNT_ID" = "None" ]; then
            echo "Could not resolve the account id of the assumed role."
            exit 1
          fi
          echo "account-id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION_INPUT}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Assemble the ECR registry list
        id: registries
        env:
          ACCOUNT_ID: ${{ steps.registry.outputs.account-id }}
          ADDITIONAL: ${{ inputs.additional-ecr-registries }}
        run: |
          set -euo pipefail
          LIST=$(printf '%s\n%s\n' "$ACCOUNT_ID" "$ADDITIONAL" \
            | tr ',' '\n' \
            | tr -d '[:blank:]\r"' \
            | grep -E '^[0-9]{12}$' \
            | awk '!seen[$0]++' \
            | paste -sd ',' - || true)
          if [ -z "$LIST" ]; then
            echo "No valid twelve digit account id resolved for the ECR login."
            exit 1
          fi
          echo "Logging in to ECR registries: $LIST"
          echo "registries=${LIST}" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ steps.registries.outputs.registries }}

      - name: Compute the immutable tag
        id: tag
        run: echo "image-tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: existing
        if: inputs.skip-if-tag-exists
        env:
          REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.image-tag }}
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text 2>/dev/null || true)
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "Tag $IMAGE_TAG already resolves to $DIGEST. Skipping the build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $IMAGE_TAG does not resolve yet. Building."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Mint a CodeArtifact token
        if: inputs.codeartifact-domain != '' && steps.existing.outputs.exists != 'true'
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ inputs.codeartifact-domain-owner }}
        run: |
          set -euo pipefail
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "CodeArtifact returned no authorization token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Build and push the image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: ${{ inputs.build-args }}
          secret-envs: ${{ inputs.codeartifact-domain != '' && format('{0}=CODEARTIFACT_AUTH_TOKEN', inputs.codeartifact-secret-id) || '' }}
          tags: ${{ steps.registry.outputs.registry }}/${{ inputs.ecr-repository }}:${{ steps.tag.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the image URI
        id: uri
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.image-tag }}
          EXISTED: ${{ steps.existing.outputs.exists }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$EXISTED" = "true" ]; then
            DIGEST="$EXISTING_DIGEST"
            SOURCE="already present, build skipped"
          else
            DIGEST="$BUILD_DIGEST"
            SOURCE="built and pushed"
          fi
          if [ -z "$DIGEST" ]; then
            echo "No digest resolved for ${REPOSITORY}:${IMAGE_TAG}."
            exit 1
          fi
          IMAGE_URI="${REGISTRY}/${REPOSITORY}@${DIGEST}"
          echo "image-digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image-uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          {
            echo "## Container image"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${REPOSITORY}\` |"
            echo "| Tag | \`${IMAGE_TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Status | ${SOURCE} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the manifest is single platform
        env:
          REPOSITORY: ${{ inputs.ecr-repository }}
          DIGEST: ${{ steps.uri.outputs.image-digest }}
        run: |
          set -euo pipefail
          MEDIA_TYPE=$(aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids "imageDigest=$DIGEST" \
            --query 'images[0].imageManifestMediaType' \
            --output text)
          echo "Manifest media type: $MEDIA_TYPE"

          if [ -z "$MEDIA_TYPE" ] || [ "$MEDIA_TYPE" = "None" ]; then
            echo "Could not read the manifest media type for $DIGEST."
            exit 1
          fi

          case "$MEDIA_TYPE" in
            application/vnd.docker.distribution.manifest.list.v2+json | application/vnd.oci.image.index.v1+json)
              echo "The image is a multi architecture index. Lambda does not support this."
              exit 1
              ;;
            application/vnd.docker.distribution.manifest.v2+json | application/vnd.oci.image.manifest.v1+json)
              echo "Single platform image manifest. Lambda accepts this."
              ;;
            *)
              echo "Unrecognised manifest media type $MEDIA_TYPE. Refusing to deploy it."
              exit 1
              ;;
          esac

      - name: Write the image manifest
        id: manifest
        if: inputs.upload-manifest-artifact
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.image-tag }}
          DIGEST: ${{ steps.uri.outputs.image-digest }}
          IMAGE_URI: ${{ steps.uri.outputs.image-uri }}
          ARTIFACT_NAME_INPUT: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          MANIFEST_DIR="${RUNNER_TEMP}/container-image-manifest"
          mkdir -p "$MANIFEST_DIR"

          SANITISED=$(printf '%s' "$REPOSITORY" | tr -c '[:alnum:]._-' '-')
          if [ -n "$ARTIFACT_NAME_INPUT" ]; then
            ARTIFACT_NAME="$ARTIFACT_NAME_INPUT"
          else
            ARTIFACT_NAME="image-${SANITISED}-${IMAGE_TAG}"
          fi

          MANIFEST_PATH="${MANIFEST_DIR}/${ARTIFACT_NAME}.json"
          python3 - <<'PY' > "$MANIFEST_PATH"
          import json
          import os

          print(
              json.dumps(
                  {
                      "repository": os.environ["REPOSITORY"],
                      "tag": os.environ["IMAGE_TAG"],
                      "digest": os.environ["DIGEST"],
                      "image_uri": os.environ["IMAGE_URI"],
                  },
                  indent=2,
              )
          )
          PY
          cat "$MANIFEST_PATH"
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "manifest-path=${MANIFEST_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload the image manifest
        if: inputs.upload-manifest-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.manifest.outputs.artifact-name }}
          path: ${{ steps.manifest.outputs.manifest-path }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true
