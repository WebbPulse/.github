# Reusable publish of a shared TypeScript package to CodeArtifact.
#
# Idempotent: the name and version from package.json are looked up in the repository
# first, and an existing version is skipped with a notice rather than failing. That
# keeps a re-run of an already released tag green.
#
# Nothing in this file is estate specific. Domain, repository, domain owner and the
# role ARN arrive from the calling repository.
#
# Workspaces monorepos. working-directory is the package directory, because the
# metadata, build and publish steps all read package.json and run npm publish there.
# The lockfile of a workspaces repository, however, lives at the repository root and
# the install has to run there too, or the shared devDependencies are missing. Pass
# cache-dependency-path and install-command to point those two at the root while
# working-directory stays on the package.
name: CodeArtifact Publish npm

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to set up."
        type: string
        required: false
        default: "22"
      working-directory:
        description: "Directory holding package.json."
        type: string
        required: false
        default: "."
      package-manager:
        description: "Package manager to use: npm or pnpm."
        type: string
        required: false
        default: "npm"
      cache-dependency-path:
        description: >-
          Lockfile path for the setup-node cache, relative to the repository root.
          Empty derives <working-directory>/package-lock.json, or pnpm-lock.yaml for
          pnpm. A workspaces monorepo keeps its only lockfile at the repository root,
          so pass "package-lock.json" there.
        type: string
        required: false
        default: ""
      install-command:
        description: >-
          Install command, run from working-directory. Empty means npm ci or
          pnpm install --frozen-lockfile. A workspaces monorepo installs from the
          repository root, for example "npm ci --no-progress --prefix ../..".
        type: string
        required: false
        default: ""
      build-command:
        description: "Build command run before publishing. Empty skips the build."
        type: string
        required: false
        default: "npm run build"
      codeartifact-domain:
        description: "CodeArtifact domain."
        type: string
        required: true
      codeartifact-repository:
        description: "CodeArtifact repository name."
        type: string
        required: true
      aws-region:
        description: "AWS region holding the CodeArtifact domain."
        type: string
        required: true
      environment:
        description: "GitHub Environment providing publish scoped variables and approvals."
        type: string
        required: false
        default: ""
      runs-on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      role-to-assume:
        description: "IAM role ARN assumed via OIDC in the artifacts account, allowed to publish."
        required: true
      codeartifact-domain-owner:
        description: "AWS account id that owns the CodeArtifact domain."
        required: true
    outputs:
      package-name:
        description: "The published package name."
        value: ${{ jobs.publish.outputs.package-name }}
      package-version:
        description: "The published package version."
        value: ${{ jobs.publish.outputs.package-version }}
      published:
        description: "true when this run uploaded the version, false when it already existed."
        value: ${{ jobs.publish.outputs.published }}

permissions:
  contents: read

# Keyed per package directory. A concurrency group holds one running and one
# pending job and cancels the rest, so a matrix of four packages sharing one group
# publishes two and cancels two. Different packages never conflict; the same
# package publishing twice is serialised and the second run finds the version
# already present and skips.
concurrency:
  group: codeartifact-publish-npm-${{ github.repository }}-${{ inputs.codeartifact-repository }}-${{ inputs.working-directory }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      package-name: ${{ steps.metadata.outputs.package-name }}
      package-version: ${{ steps.metadata.outputs.package-version }}
      published: ${{ steps.publish.outputs.published }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this workflow uses the checkout token afterwards, so the
          # credentials are not left behind in .git/config for later steps to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.cache-dependency-path != '' && inputs.cache-dependency-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json') }}

      - name: Read the package metadata
        id: metadata
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("package.json", encoding="utf-8") as handle:
              package = json.load(handle)

          name = package["name"]
          # CodeArtifact splits a scoped name into a namespace and a package name,
          # so @webbpulse/foo is looked up as namespace webbpulse, package foo.
          namespace = ""
          bare = name
          if name.startswith("@"):
              namespace, bare = name[1:].split("/", 1)

          print(f"package-name={name}")
          print(f"package-namespace={namespace}")
          print(f"package-bare-name={bare}")
          print(f"package-version={package['version']}")
          PY

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Check whether the version already exists
        id: exists
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          PACKAGE_BARE_NAME: ${{ steps.metadata.outputs.package-bare-name }}
          PACKAGE_NAMESPACE: ${{ steps.metadata.outputs.package-namespace }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
        run: |
          NAMESPACE_ARGS=()
          if [ -n "$PACKAGE_NAMESPACE" ]; then
            NAMESPACE_ARGS=(--namespace "$PACKAGE_NAMESPACE")
          fi
          # describe-package-version returns ResourceNotFoundException for an unknown
          # package or version, which is the normal first publish path.
          # Only ResourceNotFoundException means "not published yet". Any other failure
          # (denied, throttled, wrong repository) must stop the job rather than be read as
          # "absent" and turned into a doomed publish attempt.
          set +e
          ERR=$(aws codeartifact describe-package-version \
              --domain "$CODEARTIFACT_DOMAIN" \
              --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
              --repository "$CODEARTIFACT_REPOSITORY" \
              --format npm \
              --package "$PACKAGE_BARE_NAME" \
              "${NAMESPACE_ARGS[@]}" \
              --package-version "$PACKAGE_VERSION" 2>&1 >/dev/null)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$ERR" | grep -q "ResourceNotFoundException"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Version lookup failed::describe-package-version failed for ${PACKAGE_NAMESPACE:+@$PACKAGE_NAMESPACE/}${PACKAGE_BARE_NAME}@${PACKAGE_VERSION}"
            echo "$ERR"
            exit 1
          fi

      - name: Skip the publish
        if: steps.exists.outputs.exists == 'true'
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
        run: |
          echo "::notice title=Publish skipped::${PACKAGE_NAME} ${PACKAGE_VERSION} is already in CodeArtifact."
          echo "${PACKAGE_NAME} ${PACKAGE_VERSION} was already published. Nothing to do." >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to CodeArtifact for npm
        if: steps.exists.outputs.exists != 'true'
        # Run from outside the checkout. login --tool npm shells out to npm config set,
        # which npm refuses with ENOWORKSPACES when the current directory is a package
        # inside a workspaces monorepo. The settings land in ~/.npmrc (user location)
        # whatever the working directory is, so the publish step still picks them up.
        working-directory: ${{ runner.temp }}
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          PACKAGE_NAMESPACE: ${{ steps.metadata.outputs.package-namespace }}
        run: |
          set -euo pipefail
          # login --tool npm writes the auth token into ~/.npmrc and sets the default
          # registry to this repository.
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY"

          # The default registry alone is not enough for a scoped package. npm resolves
          # the publish target for @scope/name from a @scope:registry setting (or from
          # publishConfig in package.json) before falling back to the default registry,
          # so a package.json carrying neither could publish somewhere else entirely.
          # Bind the scope explicitly to the same endpoint login just configured.
          if [ -n "$PACKAGE_NAMESPACE" ]; then
            REGISTRY=$(aws codeartifact get-repository-endpoint \
              --domain "$CODEARTIFACT_DOMAIN" \
              --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
              --repository "$CODEARTIFACT_REPOSITORY" \
              --format npm \
              --query repositoryEndpoint --output text)
            npm config set "@${PACKAGE_NAMESPACE}:registry=${REGISTRY}"
            echo "Bound @${PACKAGE_NAMESPACE} to the CodeArtifact repository."
          fi

      - name: Install dependencies
        if: steps.exists.outputs.exists != 'true'
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_COMMAND" ]; then
            eval "$INSTALL_COMMAND"
          elif [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci --no-progress
          fi

      - name: Build
        if: steps.exists.outputs.exists != 'true' && inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Publish to CodeArtifact
        id: publish
        env:
          ALREADY_EXISTS: ${{ steps.exists.outputs.exists }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package-name }}
          PACKAGE_NAMESPACE: ${{ steps.metadata.outputs.package-namespace }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
        run: |
          set -euo pipefail
          if [ "$ALREADY_EXISTS" = "true" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Publishing a private package to the public registry is not recoverable, so
          # assert the resolved target is CodeArtifact before uploading anything.
          # --workspaces=false: inside a workspaces monorepo npm treats the package
          # directory as an implicit workspace and refuses npm config with ENOWORKSPACES;
          # the flag turns that detection off and reads the user config as intended.
          TARGET=$(npm config get registry --workspaces=false)
          if [ -n "$PACKAGE_NAMESPACE" ]; then
            TARGET=$(npm config get "@${PACKAGE_NAMESPACE}:registry" --workspaces=false)
          fi
          case "$TARGET" in
            *.codeartifact.*|*.on.aws/*)
              echo "Publishing to $TARGET"
              ;;
            *)
              echo "Refusing to publish: resolved registry $TARGET is not CodeArtifact."
              exit 1
              ;;
          esac

          npm publish --no-progress
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Published ${PACKAGE_NAME} ${PACKAGE_VERSION} to ${CODEARTIFACT_REPOSITORY}." >> "$GITHUB_STEP_SUMMARY"
