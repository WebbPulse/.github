# Reusable single page app deploy: build, sync to S3, invalidate CloudFront.
#
# Hashed Vite assets under assets/ are immutable, so they get a one year max-age.
# index.html and the other unhashed entry files are re-fetched every time, so they
# get no-cache. Uploading the hashed assets before index.html means a browser that
# picks up the new HTML always finds the assets it references.
#
# An optional CodeArtifact npm login runs before the install so a frontend importing
# the shared @webbpulse packages resolves them, and an optional HCP Terraform wait runs
# before the sync so a deploy never races an apply over the same bucket or distribution.
#
# Nothing in this file is estate specific. Bucket, distribution, role ARN, workspace
# name and build variables all arrive from the calling repository.
name: SPA Deploy

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to set up."
        type: string
        required: false
        default: "22"
      working-directory:
        description: "Directory holding package.json."
        type: string
        required: false
        default: "frontend"
      package-manager:
        description: "Package manager to use: npm or pnpm."
        type: string
        required: false
        default: "npm"
      cache-dependency-path:
        description: >-
          Lockfile path for the setup-node cache, relative to the repository root.
          Empty derives <working-directory>/package-lock.json, or pnpm-lock.yaml for
          pnpm. A workspaces monorepo keeps its only lockfile at the repository root,
          so pass "package-lock.json" there.
        type: string
        required: false
        default: ""
      install-command:
        description: >-
          Install command, run from working-directory. Empty means npm ci or
          pnpm install --frozen-lockfile.
        type: string
        required: false
        default: ""
      build-command:
        description: "Build command."
        type: string
        required: false
        default: "npm run build"
      build-output-directory:
        description: "Build output directory, relative to working-directory."
        type: string
        required: false
        default: "dist"
      build-env-json:
        description: "JSON object of build time environment variables, for example Vite VITE_ values."
        type: string
        required: false
        default: "{}"
      s3-bucket:
        description: "Destination S3 bucket name."
        type: string
        required: true
      s3-prefix:
        description: "Optional key prefix inside the bucket."
        type: string
        required: false
        default: ""
      cloudfront-distribution-id:
        description: "CloudFront distribution to invalidate. Empty skips the invalidation."
        type: string
        required: false
        default: ""
      invalidation-paths:
        description: >-
          Space separated extra CloudFront invalidation paths. /index.html and / are
          always invalidated, so this is only for additional paths such as
          /manifest.webmanifest. Set to /* to invalidate everything.
        type: string
        required: false
        default: ""
      immutable-asset-globs:
        description: "Space separated globs whose files carry hashed names and an immutable cache header."
        type: string
        required: false
        default: "assets/*"
      aws-region:
        description: "AWS region."
        type: string
        required: true
      environment:
        description: "GitHub Environment providing deploy scoped variables and approvals."
        type: string
        required: false
        default: ""
      concurrency-group:
        description: "Concurrency group so two deploys never overlap for the same target."
        type: string
        required: false
        default: ""
      runs-on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"
      codeartifact-domain:
        description: >-
          CodeArtifact domain holding the shared @webbpulse packages. Empty skips the
          npm login, so a frontend with no private dependencies needs nothing here.
        type: string
        required: false
        default: ""
      codeartifact-repository:
        description: "CodeArtifact repository name. Required when codeartifact-domain is set."
        type: string
        required: false
        default: ""
      codeartifact-namespace:
        description: >-
          Optional npm scope to bind to CodeArtifact, for example @webbpulse. Set it and
          only that scope resolves through CodeArtifact while everything else keeps going
          to the public registry. Leave it empty and CodeArtifact becomes the default
          registry for every package, which still resolves because the repository proxies
          its upstream, but routes all public traffic through CodeArtifact.
        type: string
        required: false
        default: ""
      tfc-organization:
        description: >-
          HCP Terraform organization owning the workspace to wait on. Required when
          tfc-workspace is set.
        type: string
        required: false
        default: ""
      tfc-workspace:
        description: >-
          HCP Terraform workspace whose runs this deploy waits for. Empty skips the
          wait, and so does an unset tfc-api-token secret.
        type: string
        required: false
        default: ""
      tfc-wait-attempts:
        description: "How many times to poll the workspace before giving up."
        type: number
        required: false
        default: 40
      tfc-wait-interval-seconds:
        description: "Seconds between polls of the workspace."
        type: number
        required: false
        default: 15
    secrets:
      role-to-assume:
        description: "IAM role ARN assumed via OIDC, allowed to write the bucket and invalidate the distribution."
        required: true
      codeartifact-domain-owner:
        description: "AWS account id that owns the CodeArtifact domain. Required when codeartifact-domain is set."
        required: false
      tfc-api-token:
        description: >-
          HCP Terraform API token used to read the workspace runs. Unset skips the
          wait, so a caller can adopt the wait one repository at a time.
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency-group != '' && inputs.concurrency-group || format('spa-deploy-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      # The secrets context is not available in a step level if, so the two conditions
      # that gate the Terraform wait are folded into one job level flag here, where it
      # is available. A caller that passes no tfc-api-token leaves this false.
      TFC_WAIT_ENABLED: ${{ inputs.tfc-workspace != '' && secrets.tfc-api-token != '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this workflow uses the checkout token afterwards, so the
          # credentials are not left behind in .git/config for later steps to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.cache-dependency-path != '' && inputs.cache-dependency-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json') }}

      # aws-region is already required, so the only extra input the login needs is the
      # repository name. Fail here with a clear message rather than with an opaque
      # action error further down.
      - name: Validate the CodeArtifact inputs
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$CODEARTIFACT_REPOSITORY" ] || MISSING="$MISSING codeartifact-repository"
          [ -n "$CODEARTIFACT_DOMAIN_OWNER" ] || MISSING="$MISSING codeartifact-domain-owner"
          if [ -n "$MISSING" ]; then
            echo "codeartifact-domain is set, so these are required too:$MISSING"
            exit 1
          fi

      # The install needs the CodeArtifact registry in place, so the role is assumed
      # here rather than after the build. The credentials the action exports stay set
      # for every later step, so the deploy steps below reuse this same session.
      - name: Configure AWS credentials via OIDC for CodeArtifact
        if: inputs.codeartifact-domain != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      # CodeArtifact hosts the shared @webbpulse packages the frontend imports. The
      # login writes the registry and auth token into ~/.npmrc, so it has to run before
      # the install. It runs from the repository root on purpose: inside a workspaces
      # tree npm resolves config against the workspace package and the registry line
      # lands in the wrong place. GetAuthorizationToken needs both
      # codeartifact:GetAuthorizationToken and sts:GetServiceBearerToken on the role.
      - name: Log in to CodeArtifact for npm
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          CODEARTIFACT_NAMESPACE: ${{ inputs.codeartifact-namespace }}
        run: |
          set -euo pipefail
          NAMESPACE_ARGS=()
          if [ -n "$CODEARTIFACT_NAMESPACE" ]; then
            NAMESPACE_ARGS=(--namespace "$CODEARTIFACT_NAMESPACE")
          fi
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY" \
            "${NAMESPACE_ARGS[@]}"

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_COMMAND" ]; then
            eval "$INSTALL_COMMAND"
          elif [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci --no-progress
          fi

      - name: Apply the build environment
        env:
          BUILD_ENV_JSON: ${{ inputs.build-env-json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid

          values = json.loads(os.environ["BUILD_ENV_JSON"] or "{}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  delimiter = f"ghadelim_{uuid.uuid4().hex}"
                  handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Applied build environment keys: " + ", ".join(sorted(values)))
          PY

      # The build is purely local. It needs no AWS credentials, and with no
      # CodeArtifact login configured none exist yet at this point.
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      # Skipped when the CodeArtifact login already assumed the role above, so the
      # deploy never assumes twice in one job.
      - name: Configure AWS credentials via OIDC
        if: inputs.codeartifact-domain == ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      # A Terraform apply touching the same bucket or distribution can land in the
      # middle of the sync below, so the deploy waits for the workspace to go idle
      # first. Both the workspace name and the token gate the step: a caller that has
      # set neither, or has set the workspace but not yet added the token, deploys
      # exactly as it did before.
      - name: Wait for the HCP Terraform workspace to go idle
        if: env.TFC_WAIT_ENABLED == 'true'
        env:
          TFC_ORGANIZATION: ${{ inputs.tfc-organization }}
          TFC_WORKSPACE: ${{ inputs.tfc-workspace }}
          TFC_API_TOKEN: ${{ secrets.tfc-api-token }}
          TFC_WAIT_ATTEMPTS: ${{ inputs.tfc-wait-attempts }}
          TFC_WAIT_INTERVAL_SECONDS: ${{ inputs.tfc-wait-interval-seconds }}
        run: |
          set -euo pipefail
          if [ -z "$TFC_ORGANIZATION" ]; then
            echo "tfc-workspace is set, so tfc-organization is required too."
            exit 1
          fi

          WORKSPACE_ID=$(curl -sfg \
            -H "Authorization: Bearer $TFC_API_TOKEN" \
            -H "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}/workspaces/${TFC_WORKSPACE}" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['data']['id'])")
          echo "Resolved workspace $TFC_WORKSPACE to $WORKSPACE_ID."

          # Every status HCP Terraform treats as the end of a run. Anything else means
          # a run is still planning, waiting for confirmation, or applying.
          TERMINAL="applied planned_and_finished discarded errored canceled force_canceled"

          for ATTEMPT in $(seq 1 "$TFC_WAIT_ATTEMPTS"); do
            STATUS=$(curl -sfg \
              -H "Authorization: Bearer $TFC_API_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID}/runs?page%5Bsize%5D=1" \
              | python3 -c "
          import json
          import sys

          runs = json.load(sys.stdin).get('data', [])
          print(runs[0]['attributes']['status'] if runs else 'no_runs')
          ")
            echo "Attempt ${ATTEMPT}/${TFC_WAIT_ATTEMPTS}: latest run status is ${STATUS}."
            if [ "$STATUS" = "no_runs" ] || echo "$TERMINAL" | grep -qw "$STATUS"; then
              echo "Terraform is idle, so the deploy can proceed."
              exit 0
            fi
            sleep "$TFC_WAIT_INTERVAL_SECONDS"
          done

          echo "Timed out waiting for the workspace to go idle."
          exit 1

      - name: Sync the hashed assets
        working-directory: ${{ inputs.working-directory }}
        env:
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_PREFIX: ${{ inputs.s3-prefix }}
          OUTPUT_DIR: ${{ inputs.build-output-directory }}
          IMMUTABLE_GLOBS: ${{ inputs.immutable-asset-globs }}
        run: |
          set -euo pipefail
          DESTINATION="s3://${S3_BUCKET}"
          if [ -n "$S3_PREFIX" ]; then
            DESTINATION="${DESTINATION}/${S3_PREFIX#/}"
          fi
          DESTINATION="${DESTINATION%/}/"

          # Pass one: hashed assets only, long lived and immutable. No --delete here,
          # so the assets the currently served index.html points at survive until the
          # second pass replaces the HTML.
          INCLUDES=()
          for GLOB in $IMMUTABLE_GLOBS; do
            INCLUDES+=(--include "$GLOB")
          done
          aws s3 sync "${OUTPUT_DIR}/" "$DESTINATION" \
            --no-progress \
            --exclude "*" \
            "${INCLUDES[@]}" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync the entry files
        working-directory: ${{ inputs.working-directory }}
        env:
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_PREFIX: ${{ inputs.s3-prefix }}
          OUTPUT_DIR: ${{ inputs.build-output-directory }}
          IMMUTABLE_GLOBS: ${{ inputs.immutable-asset-globs }}
        run: |
          set -euo pipefail
          DESTINATION="s3://${S3_BUCKET}"
          if [ -n "$S3_PREFIX" ]; then
            DESTINATION="${DESTINATION}/${S3_PREFIX#/}"
          fi
          DESTINATION="${DESTINATION%/}/"

          # Pass two: everything else, no-cache so a deploy is visible immediately.
          # Still no --delete. Once this pass lands, the edge serves the new HTML and
          # both the new and the previous asset sets are present, so no request can
          # miss. Pruning happens in pass three.
          EXCLUDES=()
          for GLOB in $IMMUTABLE_GLOBS; do
            EXCLUDES+=(--exclude "$GLOB")
          done
          aws s3 sync "${OUTPUT_DIR}/" "$DESTINATION" \
            --no-progress \
            "${EXCLUDES[@]}" \
            --cache-control "no-cache, no-store, must-revalidate"

      # Pass three exists because of a specific aws s3 sync behaviour: the CLI
      # documents --delete as "Files that exist in the destination but not in the
      # source are deleted during sync. Note that files excluded by filters are
      # excluded from deletion." A --delete carried on either filtered pass above
      # would therefore never prune the objects that pass filtered out, and stale
      # hashed assets would accumulate in the bucket forever. This pass runs over the
      # whole tree with no --include or --exclude so the delete comparison sees every
      # key. It uploads nothing new, because passes one and two already uploaded
      # every source file, so the cache headers written above are preserved.
      - name: Prune objects from earlier builds
        working-directory: ${{ inputs.working-directory }}
        env:
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_PREFIX: ${{ inputs.s3-prefix }}
          OUTPUT_DIR: ${{ inputs.build-output-directory }}
        run: |
          set -euo pipefail
          DESTINATION="s3://${S3_BUCKET}"
          if [ -n "$S3_PREFIX" ]; then
            DESTINATION="${DESTINATION}/${S3_PREFIX#/}"
          fi
          DESTINATION="${DESTINATION%/}/"

          aws s3 sync "${OUTPUT_DIR}/" "$DESTINATION" \
            --no-progress \
            --delete

      - name: Invalidate CloudFront
        if: inputs.cloudfront-distribution-id != ''
        env:
          DISTRIBUTION_ID: ${{ inputs.cloudfront-distribution-id }}
          INVALIDATION_PATHS: ${{ inputs.invalidation-paths }}
        run: |
          set -euo pipefail
          # The unhashed entry documents always need invalidating: / is what a visitor
          # requests and /index.html is what the origin serves for it. Hashed assets
          # never need it, because a new build gives them new keys. Extra paths from
          # the caller are appended, deliberately unquoted so the space separated
          # input word splits into separate arguments.
          PATHS=(/index.html /)
          # shellcheck disable=SC2206
          PATHS+=($INVALIDATION_PATHS)

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "${PATHS[@]}" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $INVALIDATION_ID created."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation $INVALIDATION_ID completed."
