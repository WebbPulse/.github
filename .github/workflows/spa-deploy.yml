name: SPA Deploy

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to set up."
        type: string
        required: false
        default: "22"
      working-directory:
        description: "Directory holding package.json."
        type: string
        required: false
        default: "frontend"
      package-manager:
        description: "Package manager to use: npm or pnpm."
        type: string
        required: false
        default: "npm"
      cache-dependency-path:
        description: >-
          Lockfile path for the setup-node cache, relative to the repository root. Empty
          derives it from working-directory; a workspaces monorepo passes "package-lock.json".
        type: string
        required: false
        default: ""
      install-command:
        description: >-
          Install command, run from working-directory. Empty means npm ci or
          pnpm install --frozen-lockfile.
        type: string
        required: false
        default: ""
      build-command:
        description: "Build command."
        type: string
        required: false
        default: "npm run build"
      build-output-directory:
        description: "Build output directory, relative to working-directory."
        type: string
        required: false
        default: "dist"
      build-env-json:
        description: "JSON object of build time environment variables, for example Vite VITE_ values."
        type: string
        required: false
        default: "{}"
      s3-bucket:
        description: "Destination S3 bucket name."
        type: string
        required: true
      s3-prefix:
        description: "Optional key prefix inside the bucket."
        type: string
        required: false
        default: ""
      cloudfront-distribution-id:
        description: "CloudFront distribution to invalidate. Empty skips the invalidation."
        type: string
        required: false
        default: ""
      invalidation-paths:
        description: >-
          Extra space separated CloudFront invalidation paths. / and /index.html are always
          invalidated; /* invalidates everything.
        type: string
        required: false
        default: ""
      immutable-asset-globs:
        description: "Space separated globs whose files carry hashed names and an immutable cache header."
        type: string
        required: false
        default: "assets/*"
      aws-region:
        description: "AWS region."
        type: string
        required: true
      environment:
        description: "GitHub Environment providing deploy scoped variables and approvals."
        type: string
        required: false
        default: ""
      concurrency-group:
        description: "Concurrency group so two deploys never overlap for the same target."
        type: string
        required: false
        default: ""
      runs-on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"
      codeartifact-domain:
        description: >-
          CodeArtifact domain holding the shared @webbpulse packages. Empty skips the
          npm login, so a frontend with no private dependencies needs nothing here.
        type: string
        required: false
        default: ""
      codeartifact-repository:
        description: "CodeArtifact repository name. Required when codeartifact-domain is set."
        type: string
        required: false
        default: ""
      codeartifact-namespace:
        description: >-
          npm scope bound to CodeArtifact, for example @webbpulse. Must start with @.
          Binding a scope keeps the public registry as the default, so only that scope
          resolves through CodeArtifact and the rest of npm is not proxied and billed.
        type: string
        required: false
        default: "@webbpulse"
      tfc-organization:
        description: >-
          HCP Terraform organization owning the workspace to wait on. Required when
          tfc-workspace is set.
        type: string
        required: false
        default: ""
      tfc-workspace:
        description: >-
          HCP Terraform workspace whose runs this deploy waits for. Empty skips the
          wait, and so does an unset tfc-api-token secret.
        type: string
        required: false
        default: ""
      tfc-wait-attempts:
        description: "How many times to poll the workspace before giving up."
        type: number
        required: false
        default: 40
      tfc-wait-interval-seconds:
        description: "Seconds between polls of the workspace."
        type: number
        required: false
        default: 15
    secrets:
      role-to-assume:
        description: "IAM role ARN assumed via OIDC, allowed to write the bucket and invalidate the distribution."
        required: true
      codeartifact-domain-owner:
        description: "AWS account id that owns the CodeArtifact domain. Required when codeartifact-domain is set."
        required: false
      tfc-api-token:
        description: >-
          HCP Terraform API token used to read the workspace runs. Unset skips the
          wait, so a caller can adopt the wait one repository at a time.
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency-group != '' && inputs.concurrency-group || format('spa-deploy-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the SPA
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      TFC_WAIT_ENABLED: ${{ inputs.tfc-workspace != '' && secrets.tfc-api-token != '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.cache-dependency-path != '' && inputs.cache-dependency-path || format('{0}/{1}', inputs.working-directory, inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json') }}

      - name: Validate the CodeArtifact inputs
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_NAMESPACE: ${{ inputs.codeartifact-namespace }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$CODEARTIFACT_REPOSITORY" ] || MISSING="$MISSING codeartifact-repository"
          [ -n "$CODEARTIFACT_DOMAIN_OWNER" ] || MISSING="$MISSING codeartifact-domain-owner"
          if [ -n "$MISSING" ]; then
            echo "codeartifact-domain is set, so these are required too:$MISSING"
            exit 1
          fi
          if [ -z "$CODEARTIFACT_NAMESPACE" ]; then
            echo "::error::codeartifact-namespace is empty. Pass the npm scope to bind, for example @webbpulse. Without it the npm login rewrites the default registry and proxies the whole public npm registry through CodeArtifact."
            exit 1
          fi
          case "$CODEARTIFACT_NAMESPACE" in
            @*) ;;
            *)
              echo "::error::codeartifact-namespace must start with @, got $CODEARTIFACT_NAMESPACE."
              exit 1
              ;;
          esac

      - name: Configure AWS credentials via OIDC for CodeArtifact
        if: inputs.codeartifact-domain != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to CodeArtifact for npm
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          CODEARTIFACT_NAMESPACE: ${{ inputs.codeartifact-namespace }}
        run: |
          set -euo pipefail
          aws codeartifact login \
            --tool npm \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY" \
            --namespace "$CODEARTIFACT_NAMESPACE"

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_COMMAND" ]; then
            eval "$INSTALL_COMMAND"
          elif [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci --no-progress
          fi

      - name: Apply the build environment
        env:
          BUILD_ENV_JSON: ${{ inputs.build-env-json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid

          values = json.loads(os.environ["BUILD_ENV_JSON"] or "{}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  delimiter = f"ghadelim_{uuid.uuid4().hex}"
                  handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Applied build environment keys: " + ", ".join(sorted(values)))
          PY

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Configure AWS credentials via OIDC
        if: inputs.codeartifact-domain == ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Wait for the HCP Terraform workspace to go idle
        if: env.TFC_WAIT_ENABLED == 'true'
        env:
          TFC_WORKSPACE_ID: ""
          TFC_ORGANIZATION: ${{ inputs.tfc-organization }}
          TFC_WORKSPACE: ${{ inputs.tfc-workspace }}
          TFC_API_TOKEN: ${{ secrets.tfc-api-token }}
          TFC_WAIT_ATTEMPTS: ${{ inputs.tfc-wait-attempts }}
          TFC_WAIT_INTERVAL_SECONDS: ${{ inputs.tfc-wait-interval-seconds }}
        run: |
          set -euo pipefail

          if [ -z "$TFC_API_TOKEN" ]; then
            echo "api-token is empty, so the workspace runs cannot be read."
            exit 1
          fi

          api() {
            curl -sfg \
              -H "Authorization: Bearer $TFC_API_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              "$1"
          }

          if [ -z "$TFC_WORKSPACE_ID" ]; then
            if [ -z "$TFC_ORGANIZATION" ] || [ -z "$TFC_WORKSPACE" ]; then
              echo "workspace-id is empty, so organization and workspace are both required."
              exit 1
            fi
            TFC_WORKSPACE_ID=$(api "https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}/workspaces/${TFC_WORKSPACE}" \
              | python3 -c "import json, sys; print(json.load(sys.stdin)['data']['id'])")
            echo "Resolved workspace ${TFC_WORKSPACE} to ${TFC_WORKSPACE_ID}."
          fi

          SETTLED="applied planned_and_finished discarded errored canceled force_canceled"

          for ATTEMPT in $(seq 1 "$TFC_WAIT_ATTEMPTS"); do
            FIELDS=$(api "https://app.terraform.io/api/v2/workspaces/${TFC_WORKSPACE_ID}/runs?page%5Bsize%5D=1" \
              | python3 -c "
          import json
          import sys

          runs = json.load(sys.stdin).get('data', [])
          if not runs:
              print('none no_runs false false')
              raise SystemExit(0)

          attributes = runs[0]['attributes']
          actions = attributes.get('actions') or {}
          print(
              runs[0]['id'],
              attributes['status'],
              str(bool(attributes.get('has-changes'))).lower(),
              str(bool(actions.get('is-confirmable'))).lower(),
          )
          ")
            read -r RUN_ID STATUS HAS_CHANGES CONFIRMABLE <<< "$FIELDS"
            echo "Attempt ${ATTEMPT}/${TFC_WAIT_ATTEMPTS}: latest run status is ${STATUS}."

            if [ "$STATUS" = "no_runs" ] || printf '%s' "$SETTLED" | grep -qw "$STATUS"; then
              echo "Terraform is idle, so the deploy can proceed."
              exit 0
            fi

            if [ "$CONFIRMABLE" = "true" ]; then
              RUN_URL="https://app.terraform.io/app/${TFC_ORGANIZATION:-_}/workspaces/${TFC_WORKSPACE:-$TFC_WORKSPACE_ID}/runs/${RUN_ID}"
              if [ "$HAS_CHANGES" = "false" ]; then
                echo "Run ${RUN_ID} is parked in ${STATUS} awaiting confirmation but plans no resource changes,"
                echo "so it cannot move anything under this deploy. Proceeding."
                echo "Run: ${RUN_URL}"
                {
                  echo "## HCP Terraform"
                  echo
                  echo "Run \`${RUN_ID}\` is awaiting confirmation with no resource changes, so the deploy did not wait."
                  echo
                  echo "[${RUN_ID}](${RUN_URL})"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Run ${RUN_ID} is parked in ${STATUS} awaiting confirmation and plans resource changes."
              echo "Waiting would time out, so this deploy stops now. Apply or discard the run, then rerun."
              echo "Run: ${RUN_URL}"
              {
                echo "## HCP Terraform"
                echo
                echo "Run \`${RUN_ID}\` is awaiting confirmation and plans resource changes, so the deploy stopped"
                echo "rather than deploying against infrastructure that is about to move."
                echo
                echo "Apply or discard it, then rerun this workflow: [${RUN_ID}](${RUN_URL})"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            sleep "$TFC_WAIT_INTERVAL_SECONDS"
          done

          echo "Timed out waiting for the workspace to go idle."
          exit 1

      - name: Sync the hashed assets
        working-directory: ${{ inputs.working-directory }}
        env:
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_PREFIX: ${{ inputs.s3-prefix }}
          OUTPUT_DIR: ${{ inputs.build-output-directory }}
          IMMUTABLE_GLOBS: ${{ inputs.immutable-asset-globs }}
        run: |
          set -euo pipefail
          DESTINATION="s3://${S3_BUCKET}"
          if [ -n "$S3_PREFIX" ]; then
            DESTINATION="${DESTINATION}/${S3_PREFIX#/}"
          fi
          DESTINATION="${DESTINATION%/}/"

          INCLUDES=()
          for GLOB in $IMMUTABLE_GLOBS; do
            INCLUDES+=(--include "$GLOB")
          done
          aws s3 sync "${OUTPUT_DIR}/" "$DESTINATION" \
            --no-progress \
            --exclude "*" \
            "${INCLUDES[@]}" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync the entry files
        working-directory: ${{ inputs.working-directory }}
        env:
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_PREFIX: ${{ inputs.s3-prefix }}
          OUTPUT_DIR: ${{ inputs.build-output-directory }}
          IMMUTABLE_GLOBS: ${{ inputs.immutable-asset-globs }}
        run: |
          set -euo pipefail
          DESTINATION="s3://${S3_BUCKET}"
          if [ -n "$S3_PREFIX" ]; then
            DESTINATION="${DESTINATION}/${S3_PREFIX#/}"
          fi
          DESTINATION="${DESTINATION%/}/"

          EXCLUDES=()
          for GLOB in $IMMUTABLE_GLOBS; do
            EXCLUDES+=(--exclude "$GLOB")
          done
          aws s3 sync "${OUTPUT_DIR}/" "$DESTINATION" \
            --no-progress \
            "${EXCLUDES[@]}" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Prune objects from earlier builds
        working-directory: ${{ inputs.working-directory }}
        env:
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_PREFIX: ${{ inputs.s3-prefix }}
          OUTPUT_DIR: ${{ inputs.build-output-directory }}
        run: |
          set -euo pipefail
          DESTINATION="s3://${S3_BUCKET}"
          if [ -n "$S3_PREFIX" ]; then
            DESTINATION="${DESTINATION}/${S3_PREFIX#/}"
          fi
          DESTINATION="${DESTINATION%/}/"

          aws s3 sync "${OUTPUT_DIR}/" "$DESTINATION" \
            --no-progress \
            --delete

      - name: Invalidate CloudFront
        if: inputs.cloudfront-distribution-id != ''
        env:
          DISTRIBUTION_ID: ${{ inputs.cloudfront-distribution-id }}
          INVALIDATION_PATHS: ${{ inputs.invalidation-paths }}
        run: |
          set -euo pipefail
          PATHS=(/index.html /)
          # shellcheck disable=SC2206
          PATHS+=($INVALIDATION_PATHS)

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "${PATHS[@]}" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $INVALIDATION_ID created."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation $INVALIDATION_ID completed."
