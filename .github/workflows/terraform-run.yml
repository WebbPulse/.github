name: Terraform Run Upload

on:
  workflow_call:
    inputs:
      api-url:
        description: "WebbPulse-Terraform API base URL, https with no path, for example https://api.example.com."
        type: string
        required: true
      audience:
        description: "Audience requested for the GitHub OIDC token the API verifies."
        type: string
        required: false
        default: "webbpulse-terraform"
permissions:
  contents: read

jobs:
  upload:
    name: Upload configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Resolve the event
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          API_URL: ${{ inputs.api-url }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$API_URL" | grep -Eq '^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?/?$'; then
            echo "::error title=terraform-run::api-url '${API_URL}' must be https://<host>[:port] with no path beyond an optional trailing slash."
            exit 1
          fi
          if ! printf '%s' "$AUDIENCE" | grep -Eq '^[A-Za-z0-9._:/-]+$'; then
            echo "::error title=terraform-run::audience '${AUDIENCE}' is empty or holds unsupported characters."
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request)
              event="pr"
              sha="$PR_HEAD_SHA"
              if [ "$HEAD_REPO" != "$REPOSITORY" ]; then
                echo "::notice title=terraform-run skipped::Pull request from fork ${HEAD_REPO} gets no OIDC token, so no configuration was uploaded."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                echo "::notice title=terraform-run skipped::This pull request run has no OIDC token, so no configuration was uploaded."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            push)
              event="push"
              sha="$PUSH_SHA"
              if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                echo "::error title=terraform-run::No OIDC token. The calling job must grant permissions id-token: write and contents: read."
                exit 1
              fi
              ;;
            *)
              echo "::error title=terraform-run::Unsupported event '${EVENT_NAME}'. terraform-run.yml supports only pull_request and push."
              exit 1
              ;;
          esac
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=terraform-run::Commit sha '${sha}' is not a 40 character hex sha."
            exit 1
          fi
          {
            echo "skip=false"
            echo "event=${event}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact commit
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Write the changed paths
        if: steps.resolve.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ steps.resolve.outputs.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE"
          fi
          out=.webbpulse/changed-paths.txt
          mkdir -p .webbpulse
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          if ! printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$' || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base sha '${base}', writing '*'."
            printf '*\n' > "$out"
          elif ! git -c "http.https://github.com/.extraheader=${auth}" fetch --no-tags --quiet --depth=1 origin "$base"; then
            echo "::warning title=terraform-run::Could not fetch base ${base}, writing '*'."
            printf '*\n' > "$out"
          elif ! git -c core.quotePath=false diff --no-renames --name-only "$base" "$SHA" > "$out.tmp"; then
            echo "::warning title=terraform-run::Could not diff ${base}..${SHA}, writing '*'."
            rm -f "$out.tmp"
            printf '*\n' > "$out"
          else
            mv "$out.tmp" "$out"
          fi
          echo "Changed paths:"
          cat "$out"

      - name: Build the archive
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tar --create \
            --file=- \
            --sort=name \
            --mtime='@0' \
            --owner=0 --group=0 --numeric-owner \
            --exclude='.git' \
            --exclude='.terraform' \
            --exclude='*.tfstate*' \
            --directory="$GITHUB_WORKSPACE" \
            . \
            | gzip -n -9 > "$RUNNER_TEMP/configuration.tar.gz"
          ls -l "$RUNNER_TEMP/configuration.tar.gz"
          sha256sum "$RUNNER_TEMP/configuration.tar.gz"

      - name: Upload the configuration
        if: steps.resolve.outputs.skip != 'true'
        env:
          API_URL: ${{ inputs.api-url }}
          AUDIENCE: ${{ inputs.audience }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ steps.resolve.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/terraform-run.XXXXXX")"
          tarball="$RUNNER_TEMP/configuration.tar.gz"
          api="${API_URL%/}"

          audience_query="$(jq -rn --arg a "$AUDIENCE" '$a | @uri')"
          if ! curl -sS --fail --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -o "$work/oidc.json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_query}"; then
            echo "::error title=terraform-run::Could not obtain a GitHub OIDC token."
            exit 1
          fi
          token="$(jq -r '.value // empty' "$work/oidc.json")"
          rm -f "$work/oidc.json"
          if [ -z "$token" ]; then
            echo "::error title=terraform-run::The GitHub OIDC response held no token."
            exit 1
          fi
          echo "::add-mask::${token}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            pr="$PR_NUMBER"
          else
            base="$PUSH_BEFORE"
            pr=""
          fi
          size="$(stat -c %s "$tarball")"
          jq -cn \
            --arg sha "$SHA" \
            --arg pr "$pr" \
            --arg base "$base" \
            --argjson size "$size" \
            '{
              "sha": $sha,
              "pr_number": (if $pr == "" then null else ($pr | tonumber) end),
              "base_sha": (if $base == "" or ($base | test("^0+$")) then null else $base end),
              "size_bytes": $size
            }' > "$work/request.json"
          echo "Request: $(cat "$work/request.json")"

          status=000
          for attempt in 1 2 3 4; do
            status="$(curl -sS -o "$work/response.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data-binary "@$work/request.json" \
              "${api}/api/v1/vcs/uploads")" || status=000
            case "$status" in
              000|5??)
                if [ "$attempt" -lt 4 ]; then
                  echo "::warning title=terraform-run::POST ${api}/api/v1/vcs/uploads returned ${status}, retrying."
                  sleep $((attempt * 3))
                  continue
                fi
                ;;
            esac
            break
          done

          if [ "$status" = "404" ]; then
            code="$(jq -r 'try (.error_code // empty | strings) catch empty' "$work/response.json" 2>/dev/null || true)"
            if [ "$code" = "VCS_REPO_NOT_BOUND" ]; then
              echo "::notice title=terraform-run skipped::This repository is not connected to a WebbPulse Terraform workspace, so no configuration was uploaded."
              exit 0
            fi
          fi
          if [ "$status" != "201" ]; then
            echo "::error title=terraform-run::POST ${api}/api/v1/vcs/uploads returned ${status}."
            head -c 4096 "$work/response.json" 2>/dev/null || true
            echo
            exit 1
          fi

          upload_url="$(jq -r '.upload_url // empty' "$work/response.json")"
          upload_id="$(jq -r '.upload_id // empty' "$work/response.json")"
          if [ -n "$upload_url" ]; then
            echo "::add-mask::${upload_url}"
            query="${upload_url#*\?}"
            if [ "$query" != "$upload_url" ] && [ -n "$query" ]; then
              echo "::add-mask::${query}"
              while IFS= read -r -d '&' pair; do
                value="${pair#*=}"
                if [ -n "$value" ] && [ "$value" != "$pair" ]; then
                  echo "::add-mask::${value}"
                  decoded="$(printf '%s' "$value" | sed 's/+/ /g; s/%\([0-9A-Fa-f][0-9A-Fa-f]\)/\\x\1/g')"
                  decoded="$(printf '%b' "$decoded")"
                  if [ "$decoded" != "$value" ]; then
                    echo "::add-mask::${decoded}"
                  fi
                fi
              done <<< "${query}&"
            fi
          fi
          if [ -z "$upload_id" ] || ! printf '%s' "$upload_url" | grep -Eq '^https://'; then
            echo "::error title=terraform-run::The API response lacked an upload_id or an https upload_url."
            exit 1
          fi
          if ! jq -e '(.headers // {}) | type == "object"' "$work/response.json" > /dev/null; then
            echo "::error title=terraform-run::The API response headers field is not an object."
            exit 1
          fi

          put_headers=()
          while IFS= read -r -d '' name && IFS= read -r -d '' value; do
            if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9!#$%&'"'"'*+.^_`|~-]+$'; then
              echo "::error title=terraform-run::The API returned an invalid upload header name."
              exit 1
            fi
            case "$value" in
              *$'\r'*|*$'\n'*)
                echo "::error title=terraform-run::The API returned an upload header value with a line break."
                exit 1
                ;;
            esac
            if [ -n "$value" ]; then
              echo "::add-mask::${value}"
              put_headers+=(-H "${name}: ${value}")
            else
              put_headers+=(-H "${name};")
            fi
          done < <(jq -j '(.headers // {}) | to_entries[] | "\(.key)\u0000\(.value | tostring)\u0000"' "$work/response.json")
          rm -f "$work/response.json"

          put_status="$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$work/put.txt" -w '%{http_code}' \
            -X PUT \
            "${put_headers[@]}" \
            --upload-file "$tarball" \
            "$upload_url")" || put_status=000
          case "$put_status" in
            2??)
              ;;
            *)
              echo "::error title=terraform-run::Upload ${upload_id} PUT returned ${put_status}."
              head -c 4096 "$work/put.txt" 2>/dev/null || true
              echo
              exit 1
              ;;
          esac
          rm -rf "$work"

          echo "Uploaded ${size} bytes as upload ${upload_id}."
          safe_id="$(printf '%s' "$upload_id" | tr -cd 'A-Za-z0-9._:-')"
          {
            echo "### Configuration uploaded"
            echo
            echo "- Upload id: \`${safe_id}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Size: ${size} bytes"
            echo
            echo "The WebbPulse-Terraform control plane picks the run up from here."
          } >> "$GITHUB_STEP_SUMMARY"
