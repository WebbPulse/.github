name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version uv provisions for the project environment."
        type: string
        required: false
        default: "3.13"
      working-directory:
        description: "Directory holding the Python project (pyproject.toml, uv.lock)."
        type: string
        required: false
        default: "backend"
      install-command:
        description: "Command used to install dependencies with uv, run inside working-directory."
        type: string
        required: false
        default: "uv sync --locked"
      ruff-target:
        description: "Paths passed to ruff check and ruff format. Empty skips both."
        type: string
        required: false
        default: "."
      lint-commands:
        description: >-
          Extra lint or format commands, one per line, run in working-directory after ruff.
        type: string
        required: false
        default: ""
      typecheck-command:
        description: "Type check command, run in its own job. Empty skips the job."
        type: string
        required: false
        default: ""
      security-commands:
        description: >-
          Security scan commands, one per line, run in their own job. For example
          `bandit -r app -ll` and `uv export --frozen --no-dev --no-emit-project --no-hashes
          -o /tmp/requirements-audit.txt && pip-audit --no-deps -r /tmp/requirements-audit.txt`.
        type: string
        required: false
        default: ""
      pytest-args:
        description: >-
          Extra arguments appended to every pytest invocation. Never paths, since those would
          apply to every job.
        type: string
        required: false
        default: ""
      pytest-workers:
        description: >-
          Value for pytest-xdist's -n. `auto` matches the runner's core count. Set to an
          empty string to omit -n entirely, for a suite that is not xdist safe.
        type: string
        required: false
        default: "auto"
      coverage-source:
        description: "Package or directory measured by coverage."
        type: string
        required: false
        default: "app"
      test-env-json:
        description: >-
          JSON object of environment variables exported before pytest. Not for secrets, which
          would be visible in the run log.
        type: string
        required: false
        default: "{}"
      domains-filter:
        description: >-
          Optional JSON array of domain names. When non-empty the discovered domains are
          intersected with it, so only the domains a change actually affects get a shard.
          The literal `[]` means no domain shards at all. Empty, the default, means no
          filtering, which is the behaviour every existing caller already has.
        type: string
        required: false
        default: ""
      run-shared:
        description: >-
          Whether to run the shared shard carrying everything outside the domain
          directories. False skips it, for a change that touches no cross-cutting test.
        type: boolean
        required: false
        default: true
      runs-on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"
      codeartifact-domain:
        description: "CodeArtifact domain. Leave empty to skip the CodeArtifact auth step."
        type: string
        required: false
        default: ""
      codeartifact-index:
        description: >-
          Name of the `[[tool.uv.index]]` entry the token authenticates, which decides the
          UV_INDEX_<NAME>_USERNAME and UV_INDEX_<NAME>_PASSWORD variables that carry it.
        type: string
        required: false
        default: "codeartifact"
      aws-region:
        description: "AWS region for the CodeArtifact token."
        type: string
        required: false
        default: ""
    secrets:
      role-to-assume:
        description: "IAM role ARN assumed via OIDC to read from CodeArtifact."
        required: false
      codeartifact-domain-owner:
        description: "AWS account id that owns the CodeArtifact domain."
        required: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover domains
    runs-on: ${{ inputs.runs-on }}
    outputs:
      domains: ${{ steps.domains.outputs.domains }}
      has-domains: ${{ steps.domains.outputs.has-domains }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - id: domains
        name: Discover the test domains
        working-directory: ${{ inputs.working-directory }}
        env:
          DOMAINS_FILTER: ${{ inputs.domains-filter }}
        run: |
          set -euo pipefail
          DOMAINS=$(python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import tomllib

          table = {}
          path = pathlib.Path("pyproject.toml")
          if path.is_file():
              with path.open("rb") as handle:
                  document = tomllib.load(handle)
              table = document.get("tool", {}).get("webbpulse", {}).get("ci", {})

          if "domains" in table:
              print(
                  "[tool.webbpulse.ci.domains] is no longer supported in v3. Domains are the "
                  "immediate subdirectories of domains-root (default '<test-root>/domains') "
                  "that contain tests. Move each domain's tests under that directory and "
                  "delete the table.",
                  file=sys.stderr,
              )
              sys.exit(1)

          test_root = table.get("test-root", "tests")
          domains_root = pathlib.Path(table.get("domains-root", f"{test_root}/domains"))
          entrypoints = table.get("entrypoints", "")

          domains = []
          if domains_root.is_dir():
              for candidate in sorted(p for p in domains_root.iterdir() if p.is_dir()):
                  if any(candidate.rglob("test_*.py")) or any(candidate.rglob("*_test.py")):
                      domains.append(candidate.name)

          if domains and entrypoints:
              root = pathlib.Path(entrypoints)
              domains_package = pathlib.Path("app/domains")

              def has_entrypoint(name):
                  """Either layout counts: a flat module, or a package with entrypoint.py."""
                  module = name.replace("-", "_")
                  if (root / f"{module}.py").is_file():
                      return True
                  return (domains_package / module / "entrypoint.py").is_file()

              missing = [name for name in domains if not has_entrypoint(name)]
              if missing:
                  existing = sorted(p.stem for p in root.glob("*.py")) if root.is_dir() else []
                  packages = (
                      sorted(p.name for p in domains_package.iterdir() if (p / "entrypoint.py").is_file())
                      if domains_package.is_dir()
                      else []
                  )
                  print(
                      "test domain directories with no matching entrypoint under "
                      f"{entrypoints}/<name>.py or app/domains/<name>/entrypoint.py: "
                      f"{', '.join(missing)}. Flat modules that do exist: "
                      f"{', '.join(existing) or '(none)'}. Domain packages that do exist: "
                      f"{', '.join(packages) or '(none)'}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          selected = os.environ.get("DOMAINS_FILTER", "").strip()
          if selected:
              try:
                  wanted = json.loads(selected)
              except json.JSONDecodeError as error:
                  print(f"domains-filter is not valid JSON: {error}", file=sys.stderr)
                  sys.exit(1)
              if not isinstance(wanted, list):
                  print("domains-filter must be a JSON array of domain names.", file=sys.stderr)
                  sys.exit(1)
              wanted = set(wanted)
              domains = [name for name in domains if name in wanted]

          print(json.dumps(domains))
          PY
          )
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"
          if [ "$DOMAINS" = "[]" ]; then
            echo "has-domains=false" >> "$GITHUB_OUTPUT"
            if [ -n "${DOMAINS_FILTER:-}" ]; then
              echo "domains-filter selected no domains, so no domain job runs."
            else
              echo "No test domain directories found. The shared job will carry the whole suite."
            fi
          else
            echo "has-domains=true" >> "$GITHUB_OUTPUT"
            echo "Domains: $DOMAINS"
          fi

  lint:
    name: Lint
    if: inputs.ruff-target != '' || inputs.lint-commands != ''
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure AWS credentials for CodeArtifact
        if: inputs.codeartifact-domain != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Authenticate the CodeArtifact index for uv
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_INDEX: ${{ inputs.codeartifact-index }}
        run: |
          set -euo pipefail
          INDEX=$(echo "$CODEARTIFACT_INDEX" | tr '[:lower:]' '[:upper:]' | tr -c '[:alnum:]' '_')
          INDEX=${INDEX%_}
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "UV_INDEX_${INDEX}_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_${INDEX}_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "Authenticated the $CODEARTIFACT_INDEX index."

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Activate the project environment
        run: |
          set -euo pipefail
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Ruff check
        if: inputs.ruff-target != ''
        run: ruff check --output-format=github ${{ inputs.ruff-target }}

      - name: Ruff format check
        if: inputs.ruff-target != ''
        run: ruff format --check --diff ${{ inputs.ruff-target }}

      - name: Extra lint commands
        if: inputs.lint-commands != ''
        env:
          LINT_COMMANDS: ${{ inputs.lint-commands }}
        run: |
          set -euo pipefail
          while IFS= read -r command; do
            [ -n "${command// /}" ] || continue
            echo "::group::$command"
            eval "$command"
            echo "::endgroup::"
          done <<< "$LINT_COMMANDS"

  typecheck:
    name: Type check
    if: inputs.typecheck-command != ''
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure AWS credentials for CodeArtifact
        if: inputs.codeartifact-domain != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Authenticate the CodeArtifact index for uv
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_INDEX: ${{ inputs.codeartifact-index }}
        run: |
          set -euo pipefail
          INDEX=$(echo "$CODEARTIFACT_INDEX" | tr '[:lower:]' '[:upper:]' | tr -c '[:alnum:]' '_')
          INDEX=${INDEX%_}
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "UV_INDEX_${INDEX}_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_${INDEX}_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "Authenticated the $CODEARTIFACT_INDEX index."

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Activate the project environment
        run: |
          set -euo pipefail
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Type check
        run: ${{ inputs.typecheck-command }}

  security:
    name: Security
    if: inputs.security-commands != ''
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure AWS credentials for CodeArtifact
        if: inputs.codeartifact-domain != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Authenticate the CodeArtifact index for uv
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_INDEX: ${{ inputs.codeartifact-index }}
        run: |
          set -euo pipefail
          INDEX=$(echo "$CODEARTIFACT_INDEX" | tr '[:lower:]' '[:upper:]' | tr -c '[:alnum:]' '_')
          INDEX=${INDEX%_}
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "UV_INDEX_${INDEX}_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_${INDEX}_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "Authenticated the $CODEARTIFACT_INDEX index."

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Activate the project environment
        run: |
          set -euo pipefail
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Security scans
        env:
          SECURITY_COMMANDS: ${{ inputs.security-commands }}
        run: |
          set -euo pipefail
          while IFS= read -r command; do
            [ -n "${command// /}" ] || continue
            echo "::group::$command"
            eval "$command"
            echo "::endgroup::"
          done <<< "$SECURITY_COMMANDS"

  domain-tests:
    name: Tests (${{ matrix.domain }})
    needs: discover
    if: needs.discover.outputs.has-domains == 'true'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJson(needs.discover.outputs.domains) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure AWS credentials for CodeArtifact
        if: inputs.codeartifact-domain != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Authenticate the CodeArtifact index for uv
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_INDEX: ${{ inputs.codeartifact-index }}
        run: |
          set -euo pipefail
          INDEX=$(echo "$CODEARTIFACT_INDEX" | tr '[:lower:]' '[:upper:]' | tr -c '[:alnum:]' '_')
          INDEX=${INDEX%_}
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "UV_INDEX_${INDEX}_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_${INDEX}_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "Authenticated the $CODEARTIFACT_INDEX index."

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Activate the project environment
        run: |
          set -euo pipefail
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Apply the test environment
        env:
          TEST_ENV_JSON: ${{ inputs.test-env-json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid

          values = json.loads(os.environ["TEST_ENV_JSON"] or "{}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  delimiter = f"ghadelim_{uuid.uuid4().hex}"
                  handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Applied test environment keys: " + ", ".join(sorted(values)))
          PY

      - name: Pytest for this domain
        env:
          DOMAIN: ${{ matrix.domain }}
          PYTEST_WORKERS: ${{ inputs.pytest-workers }}
        run: |
          set -euo pipefail
          PATHS=$(python3 - <<'PY'
          import os
          import pathlib
          import shlex
          import tomllib

          table = {}
          path = pathlib.Path("pyproject.toml")
          if path.is_file():
              with path.open("rb") as handle:
                  document = tomllib.load(handle)
              table = document.get("tool", {}).get("webbpulse", {}).get("ci", {})

          test_root = table.get("test-root", "tests")
          domains_root = table.get("domains-root", f"{test_root}/domains")
          print(shlex.quote(f"{domains_root}/{os.environ['DOMAIN']}"))
          PY
          )
          echo "Running: $PATHS"
          if [ -n "${PYTEST_WORKERS:-}" ] && ! python -c 'import xdist' 2>/dev/null; then
            echo "::warning::pytest-xdist is not installed, so tests run single process. Add it to this project's dev dependencies to use pytest-workers."
            PYTEST_WORKERS=""
          fi
          eval "python -m pytest ${PYTEST_WORKERS:+-n \"$PYTEST_WORKERS\"} \
            --cov=${{ inputs.coverage-source }} \
            --cov-report=term-missing \
            --cov-report=xml:coverage-$DOMAIN.xml \
            --junitxml=pytest-$DOMAIN.xml \
            --no-cov-on-fail \
            $PATHS ${{ inputs.pytest-args }}"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.domain }}
          path: |
            ${{ inputs.working-directory }}/coverage-${{ matrix.domain }}.xml
            ${{ inputs.working-directory }}/pytest-${{ matrix.domain }}.xml
          retention-days: 7
          if-no-files-found: ignore

  shared-tests:
    name: Tests (shared)
    needs: discover
    if: inputs.run-shared
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure AWS credentials for CodeArtifact
        if: inputs.codeartifact-domain != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Authenticate the CodeArtifact index for uv
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_INDEX: ${{ inputs.codeartifact-index }}
        run: |
          set -euo pipefail
          INDEX=$(echo "$CODEARTIFACT_INDEX" | tr '[:lower:]' '[:upper:]' | tr -c '[:alnum:]' '_')
          INDEX=${INDEX%_}
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "UV_INDEX_${INDEX}_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_${INDEX}_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "Authenticated the $CODEARTIFACT_INDEX index."

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Activate the project environment
        run: |
          set -euo pipefail
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Apply the test environment
        env:
          TEST_ENV_JSON: ${{ inputs.test-env-json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid

          values = json.loads(os.environ["TEST_ENV_JSON"] or "{}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  delimiter = f"ghadelim_{uuid.uuid4().hex}"
                  handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Applied test environment keys: " + ", ".join(sorted(values)))
          PY

      - name: Pytest for everything outside the domain directories
        env:
          PYTEST_WORKERS: ${{ inputs.pytest-workers }}
        run: |
          set -euo pipefail
          PATHS=$(python3 - <<'PY'
          import pathlib
          import shlex
          import tomllib

          table = {}
          path = pathlib.Path("pyproject.toml")
          if path.is_file():
              with path.open("rb") as handle:
                  document = tomllib.load(handle)
              table = document.get("tool", {}).get("webbpulse", {}).get("ci", {})

          test_root = table.get("test-root", "tests")
          domains_root = table.get("domains-root", f"{test_root}/domains")
          args = [test_root]
          if pathlib.Path(domains_root).is_dir():
              args.append(f"--ignore={domains_root}")
          print(" ".join(shlex.quote(a) for a in args))
          PY
          )
          echo "Running: $PATHS"
          if [ -n "${PYTEST_WORKERS:-}" ] && ! python -c 'import xdist' 2>/dev/null; then
            echo "::warning::pytest-xdist is not installed, so tests run single process. Add it to this project's dev dependencies to use pytest-workers."
            PYTEST_WORKERS=""
          fi
          eval "python -m pytest ${PYTEST_WORKERS:+-n \"$PYTEST_WORKERS\"} \
            --cov=${{ inputs.coverage-source }} \
            --cov-report=term-missing \
            --cov-report=xml:coverage-shared.xml \
            --junitxml=pytest-shared.xml \
            --no-cov-on-fail \
            $PATHS ${{ inputs.pytest-args }}"

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage-shared.xml ]; then
            echo "No coverage report produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage-shared.xml").getroot()
          line_rate = float(root.get("line_rate", 0)) * 100
          branch_rate = float(root.get("branch_rate", 0)) * 100
          print("## Python coverage (shared job)")
          print()
          print("Domain jobs upload their own reports as artifacts. This figure covers the")
          print("tests outside the domain directories, so it is a floor rather than the suite total.")
          print()
          print("| Metric | Value |")
          print("| --- | --- |")
          print(f"| Line coverage | {line_rate:.2f}% |")
          print(f"| Branch coverage | {branch_rate:.2f}% |")
          PY

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shared
          path: |
            ${{ inputs.working-directory }}/coverage-shared.xml
            ${{ inputs.working-directory }}/pytest-shared.xml
          retention-days: 7
          if-no-files-found: ignore

  all-checks-passed:
    name: all-checks-passed
    runs-on: ${{ inputs.runs-on }}
    needs: [discover, lint, typecheck, security, domain-tests, shared-tests]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
