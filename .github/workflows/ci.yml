# This repository's own pull request gate.
#
# Everything else here is a reusable workflow, called by other repositories and triggered by
# `workflow_call`. None of it runs on `pull_request`, so until this file existed a change to
# the workflows every other repository depends on was merged without anything checking it.
#
# The gate also has to exist for a second reason. `main-protection` requires the
# `all-checks-passed` context, and a required context that is never reported does not fail a
# pull request: it leaves it pending forever, unmergeable, with nothing on the page saying
# why. A repository with a required check and no workflow to report it is wedged.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # actionlint parses every workflow and checks the things a YAML parser cannot: unknown
      # `uses:` inputs, expressions referencing jobs that do not exist, shell bugs in `run:`
      # blocks via shellcheck. A malformed reusable workflow here breaks every consumer's CI
      # at once and the error surfaces in their repository rather than this one, so catching
      # it on the pull request that introduced it is worth a job of its own.
      - name: Run actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  # The single context main-protection requires.
  #
  # `skipped` counts as success so a path-filtered job cannot block a docs-only pull request;
  # `cancelled` is a failure, because a cancelled job has proven nothing.
  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [actionlint]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
