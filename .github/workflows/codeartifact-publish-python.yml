# Reusable publish of a shared Python package to CodeArtifact.
#
# Idempotent: the version in the built distribution is looked up in the repository
# first, and an existing version is skipped with a notice rather than failing. That
# keeps a re-run of an already released tag green.
#
# Nothing in this file is estate specific. Domain, repository, domain owner and the
# role ARN arrive from the calling repository.
name: CodeArtifact Publish Python

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to set up."
        type: string
        required: false
        default: "3.13"
      working-directory:
        description: "Directory holding pyproject.toml."
        type: string
        required: false
        default: "."
      codeartifact-domain:
        description: "CodeArtifact domain."
        type: string
        required: true
      codeartifact-repository:
        description: "CodeArtifact repository name."
        type: string
        required: true
      aws-region:
        description: "AWS region holding the CodeArtifact domain."
        type: string
        required: true
      environment:
        description: "GitHub Environment providing publish scoped variables and approvals."
        type: string
        required: false
        default: ""
      runs-on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      role-to-assume:
        description: "IAM role ARN assumed via OIDC in the artifacts account, allowed to publish."
        required: true
      codeartifact-domain-owner:
        description: "AWS account id that owns the CodeArtifact domain."
        required: true
    outputs:
      package-name:
        description: "The published package name."
        value: ${{ jobs.publish.outputs.package-name }}
      package-version:
        description: "The published package version."
        value: ${{ jobs.publish.outputs.package-version }}
      published:
        description: "true when this run uploaded the version, false when it already existed."
        value: ${{ jobs.publish.outputs.published }}

permissions:
  contents: read

concurrency:
  group: codeartifact-publish-python-${{ github.repository }}-${{ inputs.codeartifact-repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      package-name: ${{ steps.metadata.outputs.package-name }}
      package-version: ${{ steps.metadata.outputs.package-version }}
      published: ${{ steps.publish.outputs.published }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this workflow uses the checkout token afterwards, so the
          # credentials are not left behind in .git/config for later steps to reuse.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build the distribution
        run: python -m build

      - name: Read the package metadata
        id: metadata
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel was produced in dist/.")

          # Wheel filenames are name-version-pythontag-abitag-platformtag.whl and the
          # name and version carry no hyphens, per PEP 427 escaping.
          name, version = wheels[0].name.split("-")[:2]
          normalized = re.sub(r"[-_.]+", "-", name).lower()
          print(f"package-name={normalized}")
          print(f"package-version={version}")
          PY

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Check whether the version already exists
        id: exists
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
        run: |
          # describe-package-version returns ResourceNotFoundException for an unknown
          # package or version, which is the normal first publish path.
          if aws codeartifact describe-package-version \
              --domain "$CODEARTIFACT_DOMAIN" \
              --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
              --repository "$CODEARTIFACT_REPOSITORY" \
              --format pypi \
              --package "$PACKAGE_NAME" \
              --package-version "$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip the publish
        if: steps.exists.outputs.exists == 'true'
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
        run: |
          echo "::notice title=Publish skipped::${PACKAGE_NAME} ${PACKAGE_VERSION} is already in CodeArtifact."
          echo "${PACKAGE_NAME} ${PACKAGE_VERSION} was already published. Nothing to do." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to CodeArtifact
        id: publish
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
          ALREADY_EXISTS: ${{ steps.exists.outputs.exists }}
        run: |
          set -euo pipefail
          if [ "$ALREADY_EXISTS" = "true" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # login --tool twine writes the repository URL and credentials into
          # ~/.pypirc under a profile named after the CodeArtifact repository.
          aws codeartifact login \
            --tool twine \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY"

          twine upload --repository "codeartifact" dist/*
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Published ${PACKAGE_NAME} ${PACKAGE_VERSION} to ${CODEARTIFACT_REPOSITORY}." >> "$GITHUB_STEP_SUMMARY"
