name: End-to-end verification

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Target environment name, staging or production. Also the GitHub Environment the
          suite job runs in. Empty lets the gate derive it from the deployed branch, which
          is the standard caller shape.
        type: string
        required: false
        default: ""
      sha:
        description: >-
          Commit the check run is published on. Empty lets the gate resolve it, which is the
          triggering deploy's head_sha on a workflow_run and github.sha otherwise.
        type: string
        required: false
        default: ""
      deploy-workflows:
        description: >-
          Comma separated names of the caller's deploy workflows, in ownership order, for
          example "Deploy Backend, Frontend Deploy". The first name with a run on the
          deployed commit owns the suite; the others are waited for and then yield. Empty
          disables the sibling wait and every workflow_run trigger owns its own suite.
        type: string
        required: false
        default: ""
      production-branch:
        description: "Branch whose deploys mean production. Every other branch derives staging."
        type: string
        required: false
        default: "main"
      read-only-environments:
        description: >-
          Comma separated environment names that run the suite read only. A read only run is
          anonymous: the plugin skips every signed in and mutating test, and E2E_USER_EMAIL
          and E2E_USER_PASSWORD are not required. Empty makes every environment full.
        type: string
        required: false
        default: "production"
      api-base-url:
        description: >-
          Base URL of the deployed API, for example https://api.staging.example.com.
          Empty reads the environment variable E2E_API_BASE_URL.
        type: string
        required: false
        default: ""
      web-base-url:
        description: "Base URL of the deployed web origin. Empty reads the environment variable E2E_WEB_BASE_URL."
        type: string
        required: false
        default: ""
      aws-region:
        description: "AWS region holding the gateway, the access log group and the identity key."
        type: string
        required: false
        default: "us-west-2"
      api-id:
        description: >-
          API Gateway v2 api id, used to read the live route table. Empty reads the
          environment variable E2E_API_ID.
        type: string
        required: false
        default: ""
      access-log-group:
        description: >-
          CloudWatch log group carrying the gateway access log. Empty reads the environment
          variable E2E_ACCESS_LOG_GROUP.
        type: string
        required: false
        default: ""
      gate-ssm-parameter:
        description: >-
          SSM SecureString parameter holding the staging x-origin-verify value. The suite reads
          it itself with boto3, so the value never reaches the workflow. Empty skips the gate,
          which is what production passes.
        type: string
        required: false
        default: ""
      gate-signing-key-ssm-parameter:
        description: >-
          SSM SecureString parameter holding the staging access gate signing key. The suite
          reads it itself with boto3 to mint CloudFront signed cookies, so the PEM never
          reaches the workflow. Empty means no web gate, which is what production passes.
        type: string
        required: false
        default: ""
      gate-key-pair-id:
        description: "CloudFront public key id the minted gate cookies name. Empty means no web gate."
        type: string
        required: false
        default: ""
      gate-cookie-domain:
        description: "Domain the minted gate cookies are scoped to, the staging apex. Empty means no web gate."
        type: string
        required: false
        default: ""
      user-email:
        description: >-
          Address of the durable e2e user. Empty reads the environment variable
          E2E_USER_EMAIL, which is the standard source.
        type: string
        required: false
        default: ""
      working-directory:
        description: "Python project root holding pyproject.toml and uv.lock."
        type: string
        required: false
        default: "."
      e2e-directory:
        description: "Directory pytest collects, relative to working-directory."
        type: string
        required: false
        default: "e2e"
      install-command:
        description: "Command used to install the e2e dependency group with uv."
        type: string
        required: false
        default: "uv sync --locked --only-group e2e"
      python-version:
        description: "Python version uv provisions for the project environment."
        type: string
        required: false
        default: "3.13"
      pytest-args:
        description: "Extra arguments appended to the pytest invocation."
        type: string
        required: false
        default: ""
      browser:
        description: "Playwright browser the suite drives, chromium, firefox or webkit."
        type: string
        required: false
        default: "chromium"
      timeout-minutes:
        description: "Minutes the suite job may run before GitHub cancels it, so a hung run never blocks the next one in the concurrency group."
        type: number
        required: false
        default: 90
      headless:
        description: "Run the browser headless."
        type: boolean
        required: false
        default: true
      check-name:
        description: "Name of the published check run. Empty derives `e2e (<environment>)`."
        type: string
        required: false
        default: ""
      legacy-route-names:
        description: "Comma separated strings that must not appear in the deployed bundle."
        type: string
        required: false
        default: ""
      mint-enabled:
        description: "Allow the suite to mint test tokens with KMS. Staging only, refused in production."
        type: boolean
        required: false
        default: false
      kms-key-id:
        description: "Identity signing key used by mint_test_token."
        type: string
        required: false
        default: ""
      issuer:
        description: "Expected token issuer for this environment."
        type: string
        required: false
        default: ""
      audience:
        description: "Expected token audience for this environment."
        type: string
        required: false
        default: ""
      codeartifact-domain:
        description: "CodeArtifact domain. Leave empty to skip the CodeArtifact auth step."
        type: string
        required: false
        default: ""
      codeartifact-index:
        description: >-
          Name of the `[[tool.uv.index]]` entry the token authenticates, which decides the
          UV_INDEX_<NAME>_USERNAME and UV_INDEX_<NAME>_PASSWORD variables that carry it.
        type: string
        required: false
        default: "codeartifact"
      runs-on:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      role-to-assume:
        description: >-
          IAM role ARN assumed via OIDC to read the gateway, the access log and the gate
          parameter. Empty reads the environment variable AWS_DEPLOY_ROLE_ARN.
        required: false
      E2E_USER_PASSWORD:
        description: "Password of the durable e2e user. Define it as an Environment secret; the job runs under the target environment, so that value is the one read. Masked by GitHub and never echoed."
        required: false
      e2e-user-password:
        description: "Deprecated name for E2E_USER_PASSWORD, read only when the new name is empty."
        required: false
      codeartifact-domain-owner:
        description: >-
          AWS account id that owns the CodeArtifact domain. Empty reads the environment
          variable CODEARTIFACT_DOMAIN_OWNER.
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.decide.outputs.sha }}
      environment: ${{ steps.decide.outputs.environment }}
      read-only: ${{ steps.decide.outputs.read-only }}
    steps:
      - name: Decide whether this run owns the suite
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          THIS_WORKFLOW: ${{ github.event.workflow_run.name }}
          DEPLOY_WORKFLOWS: ${{ inputs.deploy-workflows }}
          PRODUCTION_BRANCH: ${{ inputs.production-branch }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_SHA: ${{ inputs.sha }}
          FALLBACK_BRANCH: ${{ github.ref_name }}
          READ_ONLY_ENVIRONMENTS: ${{ inputs.read-only-environments }}
        run: |
          set -euo pipefail

          read_only_for() {
            local CANDIDATE NAME
            NAME="$1"
            if [ -z "$NAME" ]; then
              echo false
              return
            fi
            while IFS= read -r CANDIDATE; do
              if [ "$CANDIDATE" = "$NAME" ]; then
                echo true
                return
              fi
            done < <(echo "$READ_ONLY_ENVIRONMENTS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')
            echo false
          }

          emit() {
            local READ_ONLY
            READ_ONLY=$(read_only_for "$3")
            {
              echo "run=$1"
              echo "sha=$2"
              echo "environment=$3"
              echo "read-only=$READ_ONLY"
            } >> "$GITHUB_OUTPUT"
          }

          derive_environment() {
            if [ -n "$INPUT_ENVIRONMENT" ]; then
              echo "$INPUT_ENVIRONMENT"
            elif [ "$1" = "$PRODUCTION_BRANCH" ]; then
              echo production
            else
              echo staging
            fi
          }

          if [ "$EVENT_NAME" != "workflow_run" ] || [ -z "$DEPLOY_WORKFLOWS" ]; then
            SHA="${INPUT_SHA:-$GITHUB_SHA}"
            ENVIRONMENT=$(derive_environment "$FALLBACK_BRANCH")
            echo "No sibling gating applies for a ${EVENT_NAME} event; this run owns the suite."
            emit true "$SHA" "$ENVIRONMENT"
            exit 0
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "${THIS_WORKFLOW} concluded ${CONCLUSION}, so there is nothing sound to verify."
            emit false "" ""
            exit 0
          fi

          SHA="${INPUT_SHA:-$HEAD_SHA}"
          ENVIRONMENT=$(derive_environment "$HEAD_BRANCH")
          echo "Verifying ${ENVIRONMENT} at ${SHA}."

          mapfile -t NAMES < <(echo "$DEPLOY_WORKFLOWS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')

          runs_for() {
            gh api "repos/${REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$1\")]"
          }

          for ATTEMPT in $(seq 1 60); do
            PENDING_NAME=""
            OWNER=""
            FAILED_NAME=""

            for NAME in "${NAMES[@]}"; do
              RUNS=$(runs_for "$NAME")
              COUNT=$(echo "$RUNS" | jq 'length')

              if [ "$COUNT" -eq 0 ]; then
                echo "No ${NAME} run exists on ${SHA}; this commit did not touch it."
                continue
              fi

              if [ -z "$OWNER" ]; then
                OWNER="$NAME"
              fi

              UNFINISHED=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
              if [ "$UNFINISHED" -gt 0 ]; then
                PENDING_NAME="$NAME"
                break
              fi

              SUCCEEDED=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length')
              if [ "$SUCCEEDED" -eq 0 ]; then
                FAILED_NAME="$NAME"
                break
              fi
            done

            if [ -n "$FAILED_NAME" ]; then
              echo "${FAILED_NAME} did not succeed on ${SHA}; the suite has nothing sound to run against."
              emit false "$SHA" "$ENVIRONMENT"
              exit 0
            fi

            if [ -n "$PENDING_NAME" ]; then
              echo "Waiting for ${PENDING_NAME} on ${SHA} (attempt ${ATTEMPT}/60)."
              sleep 30
              continue
            fi

            if [ -z "$OWNER" ]; then
              echo "No listed deploy workflow has a run on ${SHA}; this run owns the suite."
              emit true "$SHA" "$ENVIRONMENT"
              exit 0
            fi

            if [ "$THIS_WORKFLOW" = "$OWNER" ]; then
              echo "Every deploy on ${SHA} is green and ${OWNER} owns the suite, which is this run."
              emit true "$SHA" "$ENVIRONMENT"
            else
              echo "Every deploy on ${SHA} is green and ${OWNER} owns the suite, so this run yields."
              emit false "$SHA" "$ENVIRONMENT"
            fi
            exit 0
          done

          echo "::error::The deploy workflows on ${SHA} did not all finish within 30 minutes."
          emit false "$SHA" "$ENVIRONMENT"

  e2e:
    name: e2e
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ needs.gate.outputs.environment }}
    permissions:
      contents: read
      id-token: write
      checks: write
    env:
      E2E_ENVIRONMENT: ${{ needs.gate.outputs.environment }}
      E2E_API_BASE_URL: ${{ inputs.api-base-url != '' && inputs.api-base-url || vars.E2E_API_BASE_URL }}
      E2E_WEB_BASE_URL: ${{ inputs.web-base-url != '' && inputs.web-base-url || vars.E2E_WEB_BASE_URL }}
      E2E_AWS_REGION: ${{ inputs.aws-region }}
      E2E_API_ID: ${{ inputs.api-id != '' && inputs.api-id || vars.E2E_API_ID }}
      E2E_ACCESS_LOG_GROUP: ${{ inputs.access-log-group != '' && inputs.access-log-group || vars.E2E_ACCESS_LOG_GROUP }}
      E2E_GATE_SSM_PARAMETER: ${{ inputs.gate-ssm-parameter != '' && inputs.gate-ssm-parameter || vars.E2E_GATE_SSM_PARAMETER }}
      E2E_GATE_SIGNING_KEY_SSM_PARAMETER: ${{ inputs.gate-signing-key-ssm-parameter != '' && inputs.gate-signing-key-ssm-parameter || vars.E2E_GATE_SIGNING_KEY_SSM_PARAMETER }}
      E2E_GATE_KEY_PAIR_ID: ${{ inputs.gate-key-pair-id != '' && inputs.gate-key-pair-id || vars.E2E_GATE_KEY_PAIR_ID }}
      E2E_GATE_COOKIE_DOMAIN: ${{ inputs.gate-cookie-domain != '' && inputs.gate-cookie-domain || vars.E2E_GATE_COOKIE_DOMAIN }}
      E2E_BROWSER: ${{ inputs.browser }}
      E2E_HEADLESS: ${{ inputs.headless }}
      E2E_READ_ONLY: ${{ needs.gate.outputs.read-only }}
      E2E_USER_EMAIL: ${{ needs.gate.outputs.read-only != 'true' && (inputs.user-email != '' && inputs.user-email || vars.E2E_USER_EMAIL) || '' }}
      E2E_USER_PASSWORD: ${{ needs.gate.outputs.read-only != 'true' && (secrets.E2E_USER_PASSWORD != '' && secrets.E2E_USER_PASSWORD || secrets.e2e-user-password) || '' }}
      E2E_MINT_ENABLED: ${{ inputs.mint-enabled || (inputs.kms-key-id != '' && inputs.kms-key-id || vars.E2E_KMS_KEY_ID) != '' }}
      E2E_KMS_KEY_ID: ${{ inputs.kms-key-id != '' && inputs.kms-key-id || vars.E2E_KMS_KEY_ID }}
      E2E_ISSUER: ${{ inputs.issuer != '' && inputs.issuer || vars.E2E_ISSUER }}
      E2E_AUDIENCE: ${{ inputs.audience != '' && inputs.audience || vars.E2E_AUDIENCE }}
      E2E_RUN_ID: ${{ github.run_id }}
      E2E_LEGACY_ROUTE_NAMES: ${{ inputs.legacy-route-names != '' && inputs.legacy-route-names || vars.E2E_LEGACY_ROUTE_NAMES }}
      AWS_REGION: ${{ inputs.aws-region }}
      ROLE_TO_ASSUME: ${{ secrets.role-to-assume != '' && secrets.role-to-assume || vars.AWS_DEPLOY_ROLE_ARN }}
      TARGET_SHA: ${{ needs.gate.outputs.sha }}
      CHECK_NAME: ${{ inputs.check-name != '' && inputs.check-name || format('e2e ({0})', needs.gate.outputs.environment) }}
      MODE: ${{ needs.gate.outputs.read-only == 'true' && 'read-only' || 'full' }}
      JUNIT_PATH: ${{ inputs.working-directory }}/e2e-results.xml
    steps:
      - name: Check every required value resolved
        run: |
          set -euo pipefail
          REQUIRED="E2E_API_BASE_URL E2E_WEB_BASE_URL ROLE_TO_ASSUME"
          if [ "$E2E_READ_ONLY" != "true" ]; then
            REQUIRED="${REQUIRED} E2E_USER_EMAIL E2E_USER_PASSWORD"
          fi
          MISSING=""
          for NAME in $REQUIRED; do
            if [ -z "${!NAME}" ]; then
              MISSING="${MISSING} ${NAME}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::These values resolved empty for the ${E2E_ENVIRONMENT} environment:${MISSING}. Set them as Environment variables on ${E2E_ENVIRONMENT}, or pass them as explicit inputs. E2E_USER_PASSWORD is an Environment secret."
            exit 1
          fi
          if [ "$E2E_READ_ONLY" = "true" ]; then
            echo "Every required value resolved for ${E2E_ENVIRONMENT}, which runs read-only: anonymous, no sign in and no mutations."
          else
            echo "Every required value resolved for ${E2E_ENVIRONMENT}."
          fi

      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}

      - name: Authenticate the CodeArtifact index for uv
        if: inputs.codeartifact-domain != ''
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.codeartifact-domain-owner != '' && secrets.codeartifact-domain-owner || vars.CODEARTIFACT_DOMAIN_OWNER }}
          CODEARTIFACT_INDEX: ${{ inputs.codeartifact-index }}
        run: |
          set -euo pipefail
          INDEX=$(echo "$CODEARTIFACT_INDEX" | tr '[:lower:]' '[:upper:]' | tr -c '[:alnum:]' '_')
          INDEX=${INDEX%_}
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "UV_INDEX_${INDEX}_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_${INDEX}_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "Authenticated the $CODEARTIFACT_INDEX index."

      - name: Install the e2e dependency group
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Activate the project environment
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Read the installed playwright version
        id: playwright-version
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))" 2>/dev/null); then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "playwright $VERSION"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "::notice::playwright is not in the e2e group, so the browser groups are skipped."
          fi

      - name: Restore the playwright browser cache
        if: steps.playwright-version.outputs.version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ inputs.browser }}

      - name: Install the browser
        if: steps.playwright-version.outputs.version != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          E2E_BROWSER: ${{ inputs.browser }}
        run: python -m playwright install --with-deps "$E2E_BROWSER"

      - name: Run the suite
        id: suite
        working-directory: ${{ inputs.working-directory }}
        env:
          E2E_DIRECTORY: ${{ inputs.e2e-directory }}
        run: |
          set -euo pipefail
          python -m pytest "$E2E_DIRECTORY" \
            --junitxml=e2e-results.xml \
            ${{ inputs.pytest-args }}

      - name: Upload the browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-browser-${{ needs.gate.outputs.environment }}
          path: ${{ inputs.working-directory }}/e2e-browser-artifacts
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the junit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-junit-${{ needs.gate.outputs.environment }}
          path: ${{ inputs.working-directory }}/e2e-results.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the check run
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            /** Read the junit file, returning null when the suite never produced one. */
            function readJunit(file) {
              try {
                return fs.readFileSync(file, "utf8");
              } catch {
                return null;
              }
            }

            /** Collect the ids of failed and errored test cases from a junit document. */
            function failedTestIds(xml) {
              const ids = [];
              const casePattern = /<testcase\b([^>]*?)(\/>|>([\s\S]*?)<\/testcase>)/g;
              for (const match of xml.matchAll(casePattern)) {
                const attributes = match[1];
                const body = match[3] || "";
                if (!/<(failure|error)\b/.test(body)) {
                  continue;
                }
                const classname = /\bclassname="([^"]*)"/.exec(attributes);
                const name = /\bname="([^"]*)"/.exec(attributes);
                const parts = [];
                if (classname && classname[1]) {
                  parts.push(classname[1]);
                }
                if (name && name[1]) {
                  parts.push(name[1]);
                }
                ids.push(parts.join("::") || "(unnamed test)");
              }
              return ids;
            }

            /** Count totals from the junit root or testsuite element. */
            function totals(xml) {
              const attribute = (key) => {
                const pattern = new RegExp(`<testsuite\\b[^>]*?\\b${key}="(\\d+)"`, "g");
                let sum = 0;
                for (const match of xml.matchAll(pattern)) {
                  sum += Number(match[1]);
                }
                return sum;
              };
              return {
                tests: attribute("tests"),
                failures: attribute("failures"),
                errors: attribute("errors"),
                skipped: attribute("skipped"),
              };
            }

            const junitPath = process.env.JUNIT_PATH;
            const xml = readJunit(junitPath);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const suiteOutcome = process.env.SUITE_OUTCOME || "skipped";
            const mode = process.env.MODE === "read-only" ? "read-only" : "full";
            const jobStatus = process.env.JOB_STATUS;
            const conclusion = jobStatus === "success" ? "success" : jobStatus === "cancelled" ? "cancelled" : "failure";

            const lines = [];
            lines.push(`[View the workflow run](${runUrl})`);
            lines.push("");
            lines.push(`Suite: ${suiteOutcome}. Mode: ${mode}.`);
            lines.push("");
            if (mode === "read-only") {
              lines.push("A read-only run is anonymous: no sign in, no mutations, and every signed-in test is skipped.");
              lines.push("");
            }

            if (xml === null) {
              lines.push(`No junit report was written to \`${path.basename(junitPath)}\`, so the suite did not reach the reporting stage.`);
            } else {
              const counts = totals(xml);
              lines.push(`Tests: ${counts.tests}, failures: ${counts.failures}, errors: ${counts.errors}, skipped: ${counts.skipped}.`);
              const failed = failedTestIds(xml);
              if (failed.length > 0) {
                lines.push("");
                lines.push("### Failed tests");
                lines.push("");
                for (const id of failed) {
                  lines.push(`- \`${id}\``);
                }
              }
            }

            const summary = lines.join("\n");
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.CHECK_NAME,
              head_sha: process.env.TARGET_SHA,
              status: "completed",
              conclusion,
              output: {
                title: `${process.env.CHECK_NAME}: ${conclusion} (${mode})`,
                summary: summary.slice(0, 65000),
              },
            });
            core.summary.addRaw(summary).write();
